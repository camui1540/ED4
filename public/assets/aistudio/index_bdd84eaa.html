    // ---------- 角色卡导入 (动态表头锚点定位：兼容空表与插行/改列后的真实车卡) ----------
    function triggerSheetImport() {
      document.getElementById('sheetImportInput').click();
    }

    function matchRaceId(raw) {
      const s = (raw || '').trim().toLowerCase();
      for (const [id, r] of Object.entries(RACES)) {
        if (r.aliases.some(a => s.includes(a.toLowerCase()))) return id;
      }
      return null;
    }

    function matchDisciplineId(raw) {
      const s = (raw || '').trim().toLowerCase();
      for (const [id, d] of Object.entries(DISCIPLINES)) {
        if (d.aliases.some(a => s.includes(a.toLowerCase()))) return id;
      }
      return null;
    }

    function parseAttrKey(raw) {
      const s = (raw || '').trim().toUpperCase();
      if (s.includes('敏捷') || s.includes('DEX')) return 'DEX';
      if (s.includes('力量') || s.includes('STR')) return 'STR';
      if (s.includes('强韧') || s.includes('TOU')) return 'TOU';
      if (s.includes('感知') || s.includes('PER')) return 'PER';
      if (s.includes('意志') || s.includes('WIL')) return 'WIL';
      if (s.includes('魅力') || s.includes('CHA')) return 'CHA';
      return 'DEX';
    }

    function applyImportedData(data) {
      const pl = state.pl;
      if (data.name) pl.name = data.name;
      if (data.raceId) pl.raceId = data.raceId;
      if (data.disciplineId) pl.disciplineId = data.disciplineId;
      if (data.circle) pl.circle = Math.max(1, Math.min(15, Number(data.circle) || 1));
      if (pl.circle >= 9) pl.karmaDie = 8;

      const race = RACES[pl.raceId];
      if (data.attrs) {
        for (const k of Object.keys(ATTR_NAMES)) {
          if (data.attrs[k] && !isNaN(data.attrs[k])) {
            pl.attrMods[k] = data.attrs[k] - race.base[k];
          }
        }
      }
      if (data.initAdj !== undefined && !isNaN(data.initAdj)) {
        if (data.initAdj < 0) {
          pl.armor.initPen = Math.abs(data.initAdj);
          pl.initBonus = 0;
        } else {
          pl.armor.initPen = 0;
          pl.initBonus = data.initAdj;
        }
      }
      if (data.currentDamage !== undefined && !isNaN(data.currentDamage)) pl.currentDamage = Number(data.currentDamage);
      if (data.bloodDamage !== undefined && !isNaN(data.bloodDamage)) pl.bloodDamage = Number(data.bloodDamage);
      if (data.wounds !== undefined && !isNaN(data.wounds)) pl.wounds = Number(data.wounds);
      if (data.talents && data.talents.length > 0) pl.talents = data.talents;
      if (data.weapons && data.weapons.length > 0) pl.weapons = data.weapons;
      if (data.spells) pl.spells = data.spells;
      if (data.skills) pl.skills = data.skills;
      if (data.gear) {
        pl.gear = data.gear.map(g => ({ ...g, equipped: g.equipped !== false }));
      }
      if (data.threadItems) {
        pl.threadItems = data.threadItems.map(ti => ({ ...ti, equipped: ti.equipped !== false }));
      }
      const impBonuses = calcEquippedBonuses(pl.gear, pl.threadItems);
      if (impBonuses.pa > 0) pl.armor.pa = 0;
      if (impBonuses.ma > 0) pl.armor.ma = 0;
      if (impBonuses.pd > 0) pl.shield.pd = 0;
      if (impBonuses.md > 0) pl.shield.md = 0;
      if (data.attrs) {
        for (const k of Object.keys(ATTR_NAMES)) {
          if (data.attrs[k] && !isNaN(data.attrs[k])) {
            pl.attrMods[k] = data.attrs[k] - race.base[k] - (impBonuses[k] || 0);
          }
        }
      }
      if (data.legend) pl.legend = { ...pl.legend, ...data.legend };
      if (data.wealth) pl.wealth = { ...pl.wealth, ...data.wealth };

      const d = calcPlDerived();
      pl.karmaCurrent = data.karmaAvail !== undefined && !isNaN(data.karmaAvail) ? Number(data.karmaAvail) : d.karmaMax;
      pl.recoveryCurrent = d.recoveryMax;

      const matchedSpells = (pl.spells || []).filter(s => s.matchedDb).length;
      addLog(
        `已导入角色【${pl.name}】（${race.name} · ${d.prog.disc.name} ${pl.circle}环）`,
        `天赋 ${pl.talents.length} 项 | 技能 ${pl.skills.length} 项 | 武器 ${pl.weapons.length} 件 | 装备 ${pl.gear.length} 件 | 脉路物品 ${pl.threadItems.length} 件 | 法术 ${pl.spells.length} 个（匹配规则库 ${matchedSpells} 个）`,
        'hit'
      );
      renderAll();
    }

    function parseExcelWorkbook(wb) {
      const ws = wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:Z80');
      const maxR = Math.min(80, range.e.r + 1);
      const maxC = Math.min(28, range.e.c + 1);

      const cellStr = (r, c) => {
        const addr = XLSX.utils.encode_cell({ r: r - 1, c: c - 1 });
        const cell = ws[addr];
        if (!cell || cell.v === undefined || cell.v === null) return '';
        const s = String(cell.v).trim();
        return s === '#N/A' || s === 'NaN' ? '' : s;
      };
      const cellNum = (r, c) => {
        const s = cellStr(r, c);
        if (!s) return undefined;
        const n = Number(s);
        return isNaN(n) ? undefined : n;
      };
      const findCell = (exactText, rMin = 1, rMax = maxR, cMin = 1, cMax = maxC) => {
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            if (cellStr(r, c) === exactText) return { r, c };
          }
        }
        return null;
      };

      const findRightVal = (label, rMax = 10, cMax = 6) => {
        const anc = findCell(label, 1, rMax, 1, cMax);
        return anc ? cellStr(anc.r, anc.c + 1) : '';
      };
      const findRightNum = (label, rMax = 10, cMax = 6) => {
        const anc = findCell(label, 1, rMax, 1, cMax);
        return anc ? cellNum(anc.r, anc.c + 1) : undefined;
      };

      const data = {
        name: findRightVal('角色名') || cellStr(2, 2),
        raceId: matchRaceId(findRightVal('种族') || cellStr(3, 2)),
        disciplineId: matchDisciplineId(findRightVal('门类') || cellStr(4, 2)),
        circle: findRightNum('环数') || cellNum(4, 4),
        attrs: {},
        talents: [],
        weapons: [],
        spells: [],
        skills: [],
        gear: [],
        threadItems: []
      };

      // 1. 动态解析属性区
      const attrAnchor = findCell('属性', 8, 20, 1, 3);
      if (attrAnchor) {
        const hr = attrAnchor.r;
        let valCol = 2, totalCol = -1;
        for (let c = attrAnchor.c + 1; c <= attrAnchor.c + 6; c++) {
          const h = cellStr(hr, c);
          if (h === '总值') totalCol = c;
          else if (h === '数值') valCol = c;
        }
        const targetCol = totalCol > 0 ? totalCol : valCol;
        for (let r = hr + 1; r <= hr + 6; r++) {
          const label = cellStr(r, attrAnchor.c);
          const v = cellNum(r, targetCol);
          if (label && v !== undefined) {
            data.attrs[parseAttrKey(label)] = v;
          }
        }
      }

      // 2. 先攻调整 / 业力 / 健康
      const initAnchor = findCell('先攻', 15, 28, 1, 3);
      if (initAnchor) {
        for (let r = initAnchor.r + 1; r <= initAnchor.r + 4; r++) {
          const lbl = cellStr(r, initAnchor.c);
          if (lbl.includes('调整')) {
            const v = cellNum(r, initAnchor.c + 1);
            if (v !== undefined) data.initAdj = v;
          }
        }
      }
      const karmaAnchor = findCell('业力', 15, 28, 3, 6);
      if (karmaAnchor) {
        for (let r = karmaAnchor.r + 1; r <= karmaAnchor.r + 3; r++) {
          if (cellStr(r, karmaAnchor.c) === '可用') {
            data.karmaAvail = cellNum(r, karmaAnchor.c + 1);
          }
        }
      }
      const dmgCur = findCell('当前伤害', 1, 15, 8, 12);
      if (dmgCur) data.currentDamage = cellNum(dmgCur.r, dmgCur.c + 1);
      const dmgBlood = findCell('血魔法伤害', 1, 15, 8, 12);
      if (dmgBlood) data.bloodDamage = cellNum(dmgBlood.r, dmgBlood.c + 1);
      const dmgWound = findCell('负伤', 1, 15, 8, 12);
      if (dmgWound) data.wounds = cellNum(dmgWound.r, dmgWound.c + 1);

      // 3. 动态解析天赋区（解决插行错位 & 表头误导问题）
      const talAnchor = findCell('天赋', 24, 45, 1, 3);
      if (talAnchor) {
        let hr = talAnchor.r;
        // 寻找紧随其后的表头行（含“名称”）
        for (let r = talAnchor.r; r <= talAnchor.r + 2; r++) {
          if (cellStr(r, 1) === '名称' || cellStr(r, 2) === '名称') { hr = r; break; }
        }
        let nameCol = 1, rankCol = 2, attrCol = 3, strainCol = -1;
        for (let c = 1; c <= 10; c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '等级') rankCol = c;
          else if (h === '属性') attrCol = c;
          else if (h.includes('负荷') || h.includes('劳累')) strainCol = c;
        }
        for (let r = hr + 1; r <= maxR; r++) {
          const tName = cellStr(r, nameCol).replace(/\s+/g, ' ').trim();
          if (!tName || tName === 'Value' || tName === '属性') break;
          if (tName === '天赋' || tName === '名称') continue;
          const rank = cellNum(r, rankCol);
          if (rank === undefined && !cellStr(r, attrCol)) continue;
          const attr = parseAttrKey(cellStr(r, attrCol));
          const strain = strainCol > 0 ? (cellNum(r, strainCol) || 0) : 0;
          const isAttack = tName.includes('攻击') || tName.includes('武器') || tName.includes('徒手') || tName.toLowerCase().includes('weapon');
          data.talents.push({ id: `t_imp_${r}`, name: tName, attr, rank: rank || 1, strain, isAttack });
        }
      }

      // 4. 动态解析武器区
      const wpnAnchor = findCell('武器', 10, 25, 8, 12);
      if (wpnAnchor) {
        const hr = wpnAnchor.r;
        let nameCol = wpnAnchor.c + 1, dmgCol = wpnAnchor.c + 3;
        for (let c = wpnAnchor.c; c <= wpnAnchor.c + 7; c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '基础伤害' || h === '伤害') dmgCol = c;
        }
        for (let r = hr + 1; r <= hr + 10; r++) {
          const leftFlag = cellStr(r, wpnAnchor.c);
          if (leftFlag === '装备' || leftFlag === '脉路物品') break;
          const cnName = cellStr(r, nameCol);
          const enName = (leftFlag && leftFlag !== '武器') ? leftFlag : '';
          const wName = cnName || enName;
          if (!wName) continue;
          const dmgStep = cellNum(r, dmgCol) || 4;
          data.weapons.push({ id: `w_imp_${r}`, name: wName, dmgStep });
        }
      }

      // 5. 动态解析装备区（精确停止在“脉路物品”前）
      const gearAnchor = findCell('装备', 14, 35, 8, 12);
      if (gearAnchor) {
        const hr = gearAnchor.r;
        let nameCol = gearAnchor.c + 1, rankCol = gearAnchor.c + 2, effCol = gearAnchor.c + 3;
        for (let c = gearAnchor.c; c <= gearAnchor.c + 6; c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '等级') rankCol = c;
          else if (h === '效果') effCol = c;
        }
        for (let r = hr + 1; r <= hr + 20; r++) {
          const leftFlag = cellStr(r, gearAnchor.c);
          if (leftFlag === '脉路物品' || leftFlag === '角色图像' || leftFlag === '传说点数') break;
          const cnName = cellStr(r, nameCol);
          const enName = (leftFlag && leftFlag !== '装备') ? leftFlag : '';
          const gName = cnName && enName ? `${cnName} (${enName})` : (cnName || enName);
          if (!gName) continue;
          data.gear.push({ name: gName, rank: cellStr(r, rankCol), effect: cellStr(r, effCol) });
        }
      }

      // 6. 动态解析脉路物品区（锚定“脉路物品”行，绝不误收普通装备）
      const tiAnchor = findCell('脉路物品', 16, 45, 8, 12);
      if (tiAnchor) {
        const hr = tiAnchor.r;
        let nameCol = tiAnchor.c + 1, typeCol = tiAnchor.c + 2, effCol = tiAnchor.c + 3;
        for (let c = tiAnchor.c; c <= tiAnchor.c + 6; c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '类型') typeCol = c;
          else if (h === '属性' || h === '效果') effCol = c;
        }
        for (let r = hr + 1; r <= hr + 12; r++) {
          const leftFlag = cellStr(r, tiAnchor.c);
          if (leftFlag === '角色图像' || leftFlag === '传说点数' || leftFlag === '财富' || cellStr(r, tiAnchor.c + 4) === '传说点数' || cellStr(r, 13) === '传说点数' || cellStr(r, 13) === '财富') break;
          const cnName = cellStr(r, nameCol);
          const enName = (leftFlag && leftFlag !== '脉路物品') ? leftFlag : '';
          const tiName = cnName && enName ? `${cnName} (${enName})` : (cnName || enName);
          if (!tiName) continue;
          data.threadItems.push({ name: tiName, type: cellStr(r, typeCol), effect: cellStr(r, effCol) });
        }
      }

      // 7. 动态解析法术区（兼容表头偏移、中英文法术名及多行法术）
      const spAnchor = findCell('法术', 1, 15, 14, 22);
      if (spAnchor) {
        let hr = spAnchor.r;
        for (let r = spAnchor.r; r <= spAnchor.r + 1; r++) {
          if (cellStr(r, spAnchor.c + 1) === '名称' || cellStr(r, spAnchor.c) === '名称') { hr = r; break; }
        }
        let nameCol = spAnchor.c + 1, cirCol = spAnchor.c + 2, thrCol = spAnchor.c + 3, weavCol = spAnchor.c + 4, castCol = spAnchor.c + 5, durCol = spAnchor.c + 6, effCol = spAnchor.c + 7;
        for (let c = spAnchor.c; c <= Math.min(maxC, spAnchor.c + 10); c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '环数') cirCol = c;
          else if (h === '脉路') thrCol = c;
          else if (h === '编织') weavCol = c;
          else if (h === '施法') castCol = c;
          else if (h === '持续') durCol = c;
          else if (h === '效果') effCol = c;
        }
        for (let r = hr + 1; r <= maxR; r++) {
          const flag = cellStr(r, spAnchor.c);
          if (flag === '技能' || flag === '通用技能') break;
          const rawSName = cellStr(r, nameCol);
          const altSName = (flag && flag !== '法术') ? flag : '';
          const sName = ((rawSName && rawSName !== '名称') ? (altSName && !rawSName.includes(altSName) ? `${rawSName} (${altSName})` : rawSName) : altSName).replace(/^[-•·\s]+/, '');
          if (!sName || sName === '名称') continue;
          const dbMatch = findSpellInDb(sName);
          if (dbMatch) {
            data.spells.push({ ...dbMatch, instanceId: `sp_imp_${r}`, wovenThreads: 0, matchedDb: true });
          } else {
            const wText = cellStr(r, weavCol);
            const wBase = Number((wText.match(/\d+/) || [5])[0]);
            const cText = cellStr(r, castCol);
            const isFixed = /^\d+$/.test(cText);
            data.spells.push({
              id: `custom_${r}`,
              instanceId: `sp_imp_${r}`,
              nameCn: sName,
              nameEn: '',
              discipline: data.disciplineId || 'wizard',
              circle: cellNum(r, cirCol) || 1,
              threads: Number((cellStr(r, thrCol).match(/\d+/) || [0])[0]),
              weavingBase: wBase,
              weavingHigh: wBase + 5,
              castingType: isFixed ? 'fixed' : 'TMD',
              castingDn: isFixed ? Number(cText) : null,
              range: '见说明',
              duration: cellStr(r, durCol) || '-',
              aoe: '',
              effectFormula: cellStr(r, effCol) || 'WIL',
              effectType: 'utility',
              armorType: 'ma',
              desc: cellStr(r, effCol) || '自定义导入法术',
              wovenThreads: 0,
              matchedDb: false
            });
          }
        }
      }

      // 8. 动态解析技能区（支持分类、等级、关键属性与负荷）
      const skAnchor = findCell('技能', 10, 40, 16, 20);
      if (skAnchor) {
        const hr = skAnchor.r;
        let catCol = skAnchor.c, nameCol = skAnchor.c + 1, rankCol = skAnchor.c + 2, attrCol = skAnchor.c + 3, strainCol = -1;
        for (let c = skAnchor.c; c <= skAnchor.c + 8; c++) {
          const h = cellStr(hr, c);
          if (h === '名称') nameCol = c;
          else if (h === '等级') rankCol = c;
          else if (h === '属性' || h === '关键属性') attrCol = c;
          else if (h.includes('负荷') || h.includes('劳累')) strainCol = c;
        }
        for (let r = hr + 1; r <= maxR; r++) {
          const skName = cellStr(r, nameCol);
          if (!skName) continue;
          const cat = cellStr(r, catCol) || '通用技能';
          const rank = cellNum(r, rankCol) || 1;
          const attr = parseAttrKey(cellStr(r, attrCol));
          const strain = strainCol > 0 ? (cellNum(r, strainCol) || 0) : 0;
          data.skills.push({
            id: `sk_imp_${r}`,
            category: cat,
            name: skName,
            rank,
            attr,
            strain,
            isAttack: skName.includes('武器') || skName.includes('攻击')
          });
        }
      }

      // 9. 解析传说点数与财富
      const lpAnchor = findCell('传说点数', 15, 45, 10, 18);
      if (lpAnchor) {
        data.legend = {
          total: findRightVal('总计', 45, 16) || '',
          current: findRightVal('现有', 45, 16) || '',
          status: findRightVal('传说状态', 45, 16) || '',
          renown: findRightVal('名望', 45, 16) || '',
          reputation: findRightVal('声誉', 45, 16) || ''
        };
      }
      const wAnchor = findCell('财富', 20, 50, 3, 18);
      if (wAnchor) {
        const readNext = (lbl) => {
          const c = findCell(lbl, wAnchor.r, wAnchor.r + 8, wAnchor.c - 1, wAnchor.c + 2);
          return c ? (cellStr(c.r, c.c + 1) || 0) : 0;
        };
        data.wealth = {
          copper: readNext('铜币'),
          silver: readNext('银币'),
          gold: readNext('金币'),
          other: readNext('其他') || ''
        };
      }
      data.spells.forEach((sp, idx) => { sp.inMatrix = idx < 3; });

      applyImportedData(data);
    }

    function parseTxtSheet(text) {
      const lines = text.split(/\r?\n/);
      const grabField = (label) => {
        const re = new RegExp(`^${label}[：:]\\s*(.*)$`);
        for (const l of lines) {
          const m = l.trim().match(re);
          if (m) return m[1].trim();
        }
        return '';
      };

      const data = {
        name: grabField('角色名'),
        raceId: matchRaceId(grabField('种族')),
        disciplineId: matchDisciplineId(grabField('门类')),
        circle: Number((grabField('环数').match(/\d+/) || [1])[0]),
        attrs: {},
        talents: [],
        weapons: [],
        spells: [],
        skills: [],
        gear: [],
        threadItems: []
      };

      ['敏捷', '力量', '强韧', '感知', '意志', '魅力'].forEach(cn => {
        const v = grabField(cn);
        const m = v.match(/\d+/);
        if (m) data.attrs[parseAttrKey(cn)] = Number(m[0]);
      });

      const initPenStr = grabField('护甲调整');
      if (initPenStr && !isNaN(Number(initPenStr))) data.initAdj = -Math.abs(Number(initPenStr));
      const kAvail = grabField('可用');
      if (kAvail && !isNaN(Number(kAvail))) data.karmaAvail = Number(kAvail);
      const curDmg = grabField('当前伤害');
      if (curDmg && !isNaN(Number(curDmg))) data.currentDamage = Number(curDmg);
      const bDmg = grabField('血魔法伤害');
      if (bDmg && !isNaN(Number(bDmg))) data.bloodDamage = Number(bDmg);
      const wnd = grabField('负伤');
      if (wnd && !isNaN(Number(wnd))) data.wounds = Number(wnd);

      data.legend = {
        total: grabField('总计') || '',
        current: grabField('现有') || '',
        status: grabField('传说状态') || '',
        renown: grabField('名望') || '',
        reputation: grabField('声誉') || ''
      };
      data.wealth = {
        copper: grabField('铜币') || 0,
        silver: grabField('银币') || 0,
        gold: grabField('金币') || 0,
        other: grabField('其他') || ''
      };

      let section = '';
      const ALL_SECTIONS = ['属性', '先攻', '业力', '健康等级', '天赋', '武器', '法术', '装备', '传说点数', '财富', '技能', '脉路物品和编织脉路', '角色印象'];
      for (const rawLine of lines) {
        const l = rawLine.trim();
        if (!l || l.startsWith('+++')) continue;
        if (ALL_SECTIONS.includes(l)) {
          section = l;
          continue;
        }
        if (['传说点数', '财富', '属性', '先攻', '业力', '健康等级', '角色印象'].includes(section)) continue;
        if (l.startsWith('名称')) continue;
        const cols = l.split(/\s{2,}|\t+/);
        if (section === '天赋' && cols.length >= 3) {
          const tName = cols[0];
          const rank = Number((cols[1].match(/\d+/) || [1])[0]);
          const attr = parseAttrKey(cols[2]);
          const strain = cols[5] ? Number((cols[5].match(/\d+/) || [0])[0]) : 0;
          data.talents.push({ id: `t_txt_${data.talents.length}`, name: tName, attr, rank, strain, isAttack: tName.includes('武器') || tName.includes('攻击') });
        } else if (section === '武器' && cols.length >= 2) {
          const dmgStep = Number((cols[2]?.match(/\d+/) || cols[1]?.match(/\d+/) || [4])[0]);
          data.weapons.push({ id: `w_txt_${data.weapons.length}`, name: cols[0], dmgStep });
        } else if (section === '法术' && cols.length >= 1) {
          const sName = cols[0].replace(/^[-•·\s]+/, '');
          const dbMatch = findSpellInDb(sName);
          if (dbMatch) {
            data.spells.push({ ...dbMatch, instanceId: `sp_txt_${data.spells.length}`, wovenThreads: 0, matchedDb: true });
          } else {
            data.spells.push({
              id: `custom_txt_${data.spells.length}`,
              instanceId: `sp_txt_${data.spells.length}`,
              nameCn: sName,
              nameEn: '',
              discipline: data.disciplineId || 'wizard',
              circle: Number((cols[1]?.match(/\d+/) || [1])[0]),
              threads: Number((cols[2]?.match(/\d+/) || [0])[0]),
              weavingBase: Number((cols[3]?.match(/\d+/) || [5])[0]),
              weavingHigh: 10,
              castingType: /^\d+$/.test(cols[4] || '') ? 'fixed' : 'TMD',
              castingDn: /^\d+$/.test(cols[4] || '') ? Number(cols[4]) : null,
              range: '见说明',
              duration: cols[5] || '-',
              aoe: '',
              effectFormula: cols[6] || 'WIL',
              effectType: 'utility',
              armorType: 'ma',
              desc: cols[6] || 'TXT导入法术',
              wovenThreads: 0,
              matchedDb: false
            });
          }
        } else if (section === '装备') {
          data.gear.push({ name: cols[0], rank: cols[1] || '', effect: cols[2] || '' });
        } else if (section === '脉路物品和编织脉路') {
          data.threadItems.push({ name: cols[0], type: cols[1] || '', effect: cols[2] || '' });
        } else if (section === '技能' && cols.length >= 3) {
          data.skills.push({ id: `sk_txt_${data.skills.length}`, category: '通用技能', name: cols[0], rank: Number((cols[1].match(/\d+/) || [1])[0]), attr: parseAttrKey(cols[2]), strain: 0, isAttack: cols[0].includes('武器') || cols[0].includes('攻击') });
        }
      }

      data.spells.forEach((sp, idx) => { sp.inMatrix = idx < 3; });
      applyImportedData(data);
    }

    function handleSheetFileImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      const reader = new FileReader();

      if (ext === 'txt') {
        reader.onload = (e) => parseTxtSheet(e.target.result);
        reader.readAsText(file, 'utf-8');
      } else if (ext === 'xlsx' || ext === 'xls') {
        if (typeof XLSX === 'undefined') {
          addLog('Excel 解析库尚未加载成功，请检查网络或改用 TXT 角色卡导入', '', 'fail');
          return;
        }
        reader.onload = (e) => {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          parseExcelWorkbook(wb);
        };
        reader.readAsArrayBuffer(file);
      }
      event.target.value = '';
    }

    function copySpellJson() {
      const el = document.getElementById('spellJsonPreview');
      if (!el) return;
      el.select();
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(el.value);
        else document.execCommand('copy');

        document.execCommand('copy');

    function downloadSpellJson() {
      const blob = new Blob([JSON.stringify(SPELLS_DB, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ed4_spells_c1_c2.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderPlView() {
      const pl = state.pl;
      const d = calcPlDerived();
      const actionMod = getPlActionMod();
      const prog = d.prog;

      const bonusBadges = [
        `耐久 +${prog.durabilityTotal}`,
        prog.pd ? `门类物防 +${prog.pd}` : '',
        prog.md ? `门类秘防 +${prog.md}` : '',
        prog.sd ? `门类社防 +${prog.sd}` : '',
        prog.init ? `门类先攻 +${prog.init}` : '',
        prog.rec ? `门类回复 +${prog.rec}` : '',
        prog.ma ? `门类秘甲 +${prog.ma}` : ''
      ].filter(Boolean).map(b => `<span class="badge badge-ok">${b}</span>`).join('');

      const attrCards = Object.keys(ATTR_NAMES).map(k => `
        <div class="stat-box">
          <div class="stat-label">${ATTR_NAMES[k]}</div>
          <div class="stat-val">${d.attrs[k]}</div>
          <div style="margin-bottom:5px;">
            <button class="step-btn" onclick="rollAttribute('${k}')">Step ${d.steps[k]}</button>
          </div>
          <div class="row-flex" style="justify-content:center;">
            <button class="btn btn-sm" onclick="adjustAttr('${k}', -1)">-</button>
            <span style="font-size:11px; color:var(--muted); min-width:22px;">${pl.attrMods[k] >= 0 ? '+' + pl.attrMods[k] : pl.attrMods[k]}</span>
            <button class="btn btn-sm" onclick="adjustAttr('${k}', 1)">+</button>
          </div>
        </div>
      `).join('');

      const aliveMonsters = state.monsters.filter(m => m.currentDamage < m.death);
      const maxMd = aliveMonsters.length > 0 ? Math.max(...aliveMonsters.map(m => getMonsterEffectiveDef(m, 'md'))) : 0;
      const targetOptions = [
        `<option value="">无指定目标（仅掷骰）</option>`,
        ...(aliveMonsters.length > 1 ? [`<option value="aoe:all">群体目标：全场存活怪物 (${aliveMonsters.length}名${state.gmBlind ? '' : ` · 最高秘防 ${maxMd}`})</option>`] : []),
        ...aliveMonsters.map(m =>
          `<option value="m:${m.instanceId}">${m.name}${state.gmBlind ? '' : ` (物防 ${getMonsterEffectiveDef(m, 'pd')} / 秘防 ${getMonsterEffectiveDef(m, 'md')})`}</option>`
        ),
        `<option value="dn:6">固定难度 6</option>`,
        `<option value="dn:10">固定难度 10</option>`,
        `<option value="dn:14">固定难度 14</option>`
      ].join('');

      const talentRows = pl.talents.map(t => {
        const baseStep = d.steps[t.attr] + t.rank;
        const effStep = Math.max(1, baseStep + actionMod + (t.isAttack && pl.options.aggressive ? 3 : 0));
        return `
          <tr>
            <td><b>${t.name}</b> <span class="badge">${ATTR_NAMES[t.attr]}</span> ${t.strain ? `<span class="badge badge-warn">劳累 ${t.strain}</span>` : ''}</td>
            <td>
              <div class="row-flex">
                <button class="btn btn-sm" onclick="plTalentRank('${t.id}', -1)">-</button>
                <span>${t.rank}</span>
                <button class="btn btn-sm" onclick="plTalentRank('${t.id}', 1)">+</button>
              </div>
            </td>
            <td><b style="color:var(--accent);">Step ${effStep}</b></td>
            <td>
              <div class="row-flex">
                <label class="row-flex" style="font-size:11px; cursor:pointer;"><input type="checkbox" id="karma_${t.id}" style="width:auto;" />业力</label>
                <button class="btn btn-primary btn-sm" onclick="rollTalent('${t.id}')">检定</button>
                <button class="btn btn-danger btn-sm" onclick="removeTalent('${t.id}')">×</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      const skillRows = (pl.skills || []).map(sk => {

              <div class="row-flex">
                <button class="btn btn-sm" onclick="plSkillRank('${sk.id}', -1)">-</button>

                <button class="btn btn-sm" onclick="plSkillRank('${sk.id}', 1)">+</button>

            </td>
            <td><b style="color:var(--accent);">Step ${effStep}</b></td>

              <div class="row-flex">

            </td>
          </tr>
        `;
      }).join('');

      const weaponRows = pl.weapons.map(w => {
        const dmgStep = Math.max(1, d.steps.STR + w.dmgStep + (pl.options.aggressive ? 3 : 0));
        return `
          <div class="between" style="background:var(--card); padding:6px 8px; border-radius:4px; margin-bottom:5px;">

              <button class="btn btn-primary btn-sm" onclick="rollWeaponDamage('${w.id}')">伤害检定</button>
              <button class="btn btn-danger btn-sm" onclick="removeWeapon('${w.id}')">×</button>
            </div>
          </div>
        `;
      }).join('');

      const scInfo = getSpellcastingStep();
      const twInfo = getThreadWeavingStep();
      const matrixSpells = (pl.spells || []).filter(sp => sp.inMatrix !== false);
      const grimoireSpells = (pl.spells || []).filter(sp => sp.inMatrix === false);

      const renderMatrixCard = (sp) => {
        const reqThreads = Number(sp.threads) || 0;
        const curThreads = Number(sp.wovenThreads) || 0;
        const needWeave = reqThreads > 0 && curThreads < reqThreads;
        const showEffBtn = hasSpellEffectRoll(sp);
        return `
          <div class="spell-card in-matrix" draggable="true"
            ondragstart="onSpellDragStart(event,'${sp.instanceId}')"
            ondragend="onSpellDragEnd(event)"
            ondragover="event.preventDefault(); event.currentTarget.classList.add('drag-target');"
            ondragleave="event.currentTarget.classList.remove('drag-target');"
            ondrop="onSpellCardDrop(event,'${sp.instanceId}')">
            <div class="between">
              <div class="row-flex">
                <span style="color:var(--muted); cursor:grab;" title="拖拽至法术书或与其他法术互换">⠿</span>

                <span class="badge">${sp.circle}环</span>
                <span class="badge ${needWeave ? 'badge-warn' : 'badge-ok'}">脉路 ${curThreads}/${reqThreads}</span>

                <span class="badge">施法 ${sp.castingType === 'fixed' ? sp.castingDn : (sp.aoe ? '群体TMD' : 'TMD')}</span>

              </div>
              <button class="btn btn-danger btn-sm" onclick="removeSpell('${sp.instanceId}')">×</button>
            </div>
            <div style="font-size:11px; color:var(--muted);">${sp.range} · ${sp.duration}${sp.aoe ? ' · ' + sp.aoe : ''} — ${sp.desc}</div>

              <label class="row-flex" style="font-size:11px; cursor:pointer;"><input type="checkbox" id="karma_sp_${sp.instanceId}" style="width:auto;" />业力</label>

      const renderGrimoireCard = (sp) => `

              <div class="field-group">

                  <button class="btn btn-sm" onclick="state.pl.wounds=Math.max(0,state.pl.wounds-1); renderAll();">-</button>

                  <button class="btn btn-sm" onclick="state.pl.wounds++; renderAll();">+</button>

                <span>回复：<b>${pl.recoveryCurrent}/${d.recoveryMax}</b></span>
                <button class="btn btn-sm" ${pl.currentDamage > 0 || pl.wounds <= 0 || pl.recoveryCurrent <= 0 ? 'disabled' : ''} onclick="healWoundRest()">休整消伤</button>

              <div class="field-group"><label>盾牌物防</label><input type="number" value="${pl.shield.pd}" onchange="state.pl.shield.pd=Number(this.value); renderAll();" /></div>
              <div class="field-group"><label>先攻/耐久修正</label><input type="number" value="${pl.initBonus}" title="额外先攻加值" onchange="state.pl.initBonus=Number(this.value); renderAll();" /></div>

              <span class="pill ${pl.options.defensive ? 'active' : ''}" onclick="toggleOption('defensive')">防御姿态 (+3防/-3检定)</span>
              <span class="pill ${pl.options.knockdown ? 'active' : ''}" onclick="toggleOption('knockdown')">击倒攻击</span>
              <span class="pill ${pl.options.stun ? 'active' : ''}" onclick="toggleOption('stun')">震慑攻击</span>
              <span class="pill ${pl.options.splitMove ? 'active' : ''}" onclick="toggleOption('splitMove')">分散移动 (1劳累)</span>
              ${d.race.canTailAttack ? `<span class="pill ${pl.options.tailAttack ? 'active' : ''}" onclick="toggleOption('tailAttack')">尾击 (-2检定)</span>` : ''}
            </div>
            <div class="row-flex">
              <span class="pill danger ${pl.statuses.knockedDown ? 'active' : ''}" onclick="toggleStatus('knockedDown')">倒地</span>
              <span class="pill danger ${pl.statuses.blindsided ? 'active' : ''}" onclick="toggleStatus('blindsided')">盲区</span>
              <span class="pill danger ${pl.statuses.surprised ? 'active' : ''}" onclick="toggleStatus('surprised')">惊愕</span>
              <span class="pill danger ${pl.statuses.harried ? 'active' : ''}" onclick="toggleStatus('harried')">受扰</span>
              <span class="pill ${pl.statuses.reserved ? 'active' : ''}" onclick="toggleStatus('reserved')">预留动作</span>
            </div>
          </div>

        <div class="section">
          <div class="between" style="margin-bottom:8px;">
            <span class="section-title" style="margin:0;">天赋与技能检定（并列掷骰）</span>
            <div class="row-flex">
              <span style="font-size:11px; color:var(--muted);">当前目标：</span>
              <select id="plTargetSelect" style="width:220px;">${targetOptions}</select>
            </div>
          </div>

          <div class="grid-2 grid-2-responsive" style="gap:12px; margin-bottom:12px;">
            <div style="background:var(--card); border:1px solid var(--border); border-radius:5px; padding:8px;">
              <div class="section-title">
                <span>门类天赋 (${pl.talents.length})</span>
                <div class="row-flex">
                  <input type="text" placeholder="筛选天赋..." value="${state.talentFilter}" oninput="state.talentFilter=this.value; renderMain();" style="width:115px; padding:2px 6px; font-size:11px;" />
                </div>
              </div>
                <div class="scroll-panel" style="margin-bottom:8px;">
                  <table>
                    <thead><tr><th>天赋</th><th>等级</th><th>Step</th><th>操作</th></tr></thead>
                    <tbody>${pl.talents.filter(t => !state.talentFilter || t.name.toLowerCase().includes(state.talentFilter.toLowerCase())).map(t => {
                      const baseStep = d.steps[t.attr] + t.rank;
                      const effStep = Math.max(1, baseStep + actionMod + (t.isAttack && pl.options.aggressive ? 3 : 0));
                      return `
                        <tr>
                          <td><b>${t.name}</b> <span class="badge">${ATTR_NAMES[t.attr]}</span> ${t.strain ? `<span class="badge badge-warn">劳累 ${t.strain}</span>` : ''}</td>
                          <td>
                            <div class="row-flex">
                              <button class="btn btn-sm" onclick="plTalentRank('${t.id}', -1)">-</button>
                              <span>${t.rank}</span>
                              <button class="btn btn-sm" onclick="plTalentRank('${t.id}', 1)">+</button>
                            </div>
                          </td>
                          <td><b style="color:var(--accent);">Step ${effStep}</b></td>
                          <td>
                            <div class="row-flex">
                              <label class="row-flex" style="font-size:11px; cursor:pointer;"><input type="checkbox" id="karma_${t.id}" style="width:auto;" />业力</label>
                              <button class="btn btn-primary btn-sm" onclick="rollTalent('${t.id}')">检定</button>
                              <button class="btn btn-danger btn-sm" onclick="removeTalent('${t.id}')">×</button>

                    return `<option value="">当前门类(${d.prog.disc.name} ${pl.circle}环)无专属法术</option>`;

                  return list.map(s => `<option value="${s.id}">[${s.circle}环 · ${DISCIPLINES[s.discipline].name}] ${s.nameCn} (${s.nameEn})</option>`).join('');
                })()}
              </select>
              <button class="btn btn-sm" onclick="addSpellFromDb()">+ 录入法术</button>
            </div>
          </div>
          ${pl.spells && pl.spells.length > 0
            ? `
              <div class="spell-dropzone" style="margin-bottom:8px;"
                ondragover="onSpellZoneDragOver(event)"
                ondragleave="onSpellZoneDragLeave(event)"
                ondrop="onSpellZoneDrop(event, true)">
                <div style="font-size:11px; color:var(--accent); font-weight:700; margin-bottom:5px;">★ 常备法术矩阵 (${matrixSpells.length}) · 可直接拖拽法术卡片互换</div>
                ${matrixSpells.length > 0 ? `<div class="grid-2">${matrixSpells.map(renderMatrixCard).join('')}</div>` : `<div style="color:var(--muted); font-size:12px; padding:8px;">将下方「法术书」中的法术卡片拖拽至此区域即可装入矩阵。</div>`}
              </div>
              <div class="spell-dropzone"
                ondragover="onSpellZoneDragOver(event)"
                ondragleave="onSpellZoneDragLeave(event)"
                ondrop="onSpellZoneDrop(event, false)">
                <div style="font-size:11px; color:var(--muted); font-weight:700; margin-bottom:5px;">法术书已掌握其他法术 (${grimoireSpells.length})</div>
                ${grimoireSpells.length > 0 ? `<div class="grid-2">${grimoireSpells.map(renderGrimoireCard).join('')}</div>` : `<div style="color:var(--muted); font-size:12px;">将常备矩阵中的法术拖到此处即可收入法术书。</div>`}
              </div>
            `
            : `<div style="color:var(--muted); font-size:12px;">暂未录入法术，可从上方下拉框添加或直接导入 Excel/TXT 角色卡自动匹配。</div>`
          }
        </div>

        <div class="section">
          <div class="section-title"><span>装备与脉路物品（支持直接编辑与增删）</span></div>
          <div class="grid-2 grid-2-responsive" style="gap:12px; font-size:12px;">
            <div style="background:var(--card); border:1px solid var(--border); border-radius:5px; padding:8px;">
              <b style="color:var(--muted);">普通装备与防具 (${pl.gear.length})</b>
              <div class="scroll-panel" style="margin:6px 0;">
                ${pl.gear.map((g, idx) => `
                  <div class="row-flex" style="margin-bottom:4px; flex-wrap:nowrap;">
                    <input type="checkbox" ${g.equipped !== false ? 'checked' : ''} onchange="updateGear(${idx},'equipped',this.checked)" title="勾选计入面板属性/防御加值（取消即脱下）" style="width:auto; flex-shrink:0;" />
                    <input type="text" value="${(g.name || '').replace(/"/g, '&quot;')}" onchange="updateGear(${idx},'name',this.value)" placeholder="名称" style="flex:2;" />
                    <input type="text" value="${(g.rank || '').replace(/"/g, '&quot;')}" onchange="updateGear(${idx},'rank',this.value)" placeholder="等级" style="width:52px;" />
                    <input type="text" value="${(g.effect || '').replace(/"/g, '&quot;')}" onchange="updateGear(${idx},'effect',this.value)" placeholder="效果" style="flex:2;" />
                    <button class="btn btn-danger btn-sm" onclick="removeGear(${idx})">×</button>
                  </div>
                `).join('') || '<div style="color:var(--muted);">暂无装备</div>'}
              </div>
              <div class="row-flex">
                <input type="text" id="newGearName" placeholder="装备名" style="width:110px;" />
                <input type="text" id="newGearRank" placeholder="等级" style="width:54px;" />
                <input type="text" id="newGearEffect" placeholder="效果(如 物理护甲+4)" style="flex:1;" />
                <button class="btn btn-sm" onclick="addGear()">+ 装备</button>
              </div>
            </div>

            <div style="background:var(--card); border:1px solid var(--border); border-radius:5px; padding:8px;">
              <b style="color:var(--muted);">脉路物品 (${pl.threadItems.length})</b>
              <div class="scroll-panel" style="margin:6px 0;">
                ${pl.threadItems.map((ti, idx) => `
                  <div class="row-flex" style="margin-bottom:4px; flex-wrap:nowrap;">
                    <input type="checkbox" ${ti.equipped !== false ? 'checked' : ''} onchange="updateThreadItem(${idx},'equipped',this.checked)" title="勾选计入面板属性/防御加值（取消即脱下）" style="width:auto; flex-shrink:0;" />
                    <input type="text" value="${(ti.name || '').replace(/"/g, '&quot;')}" onchange="updateThreadItem(${idx},'name',this.value)" placeholder="名称" style="flex:2;" />
                    <input type="text" value="${(ti.type || '').replace(/"/g, '&quot;')}" onchange="updateThreadItem(${idx},'type',this.value)" placeholder="类型" style="width:68px;" />
                    <input type="text" value="${(ti.effect || '').replace(/"/g, '&quot;')}" onchange="updateThreadItem(${idx},'effect',this.value)" placeholder="属性/效果" style="flex:2;" />
                    <button class="btn btn-danger btn-sm" onclick="removeThreadItem(${idx})">×</button>
                  </div>
                `).join('') || '<div style="color:var(--muted);">暂无脉路物品</div>'}
              </div>
              <div class="row-flex" style="margin-bottom:10px;">
                <input type="text" id="newTiName" placeholder="脉路物品名" style="width:110px;" />
                <input type="text" id="newTiType" placeholder="类型" style="width:64px;" />
                <input type="text" id="newTiEffect" placeholder="属性加成" style="flex:1;" />
                <button class="btn btn-sm" onclick="addThreadItem()">+ 脉路物品</button>
              </div>
              <div style="border-top:1px solid var(--border); padding-top:8px;">
                <b style="color:var(--muted);">传说点数与财富</b>
                <div class="grid-3" style="margin-top:6px; gap:6px;">
                  <div class="field-group"><label>传说总计</label><input type="text" value="${pl.legend?.total ?? ''}" onchange="state.pl.legend.total=this.value" /></div>
                  <div class="field-group"><label>现有传说点</label><input type="text" value="${pl.legend?.current ?? ''}" onchange="state.pl.legend.current=this.value" /></div>
                  <div class="field-group"><label>名望 / 声誉</label><input type="text" value="${pl.legend?.renown ?? ''}" onchange="state.pl.legend.renown=this.value" placeholder="名望/声誉" /></div>
                  <div class="field-group"><label>金币</label><input type="text" value="${pl.wealth?.gold ?? 0}" onchange="state.pl.wealth.gold=this.value" /></div>
                  <div class="field-group"><label>银币</label><input type="text" value="${pl.wealth?.silver ?? 0}" onchange="state.pl.wealth.silver=this.value" /></div>
                  <div class="field-group"><label>铜币 / 其他</label><input type="text" value="${pl.wealth?.copper ?? 0}" onchange="state.pl.wealth.copper=this.value" /></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function plTalentRank(id, delta) {
      const t = state.pl.talents.find(x => x.id === id);
      if (!t) return;
      t.rank = Math.max(1, t.rank + delta);
      renderMain();
    }

    function plSkillRank(id, delta) {
      const sk = state.pl.skills.find(x => x.id === id);
      if (!sk) return;
      sk.rank = Math.max(1, sk.rank + delta);
      renderMain();
    }

    function removeTalent(id) {
      state.pl.talents = state.pl.talents.filter(x => x.id !== id);
      renderMain();
    }

    function removeSkill(id) {
      state.pl.skills = state.pl.skills.filter(x => x.id !== id);
      renderMain();
    }

    function addGear() {
      const name = document.getElementById('newGearName').value.trim();
      const rank = document.getElementById('newGearRank').value.trim();
      const effect = document.getElementById('newGearEffect').value.trim();
      if (!name) return;
      state.pl.gear.push({ name, rank, effect, equipped: true });
      renderAll();
    }

    function updateGear(idx, field, val) {
      if (!state.pl.gear[idx]) return;
      state.pl.gear[idx][field] = val;
      renderAll();
    }

    function removeGear(idx) {
      state.pl.gear.splice(idx, 1);
      renderAll();
    }

    function addThreadItem() {
      const name = document.getElementById('newTiName').value.trim();
      const type = document.getElementById('newTiType').value.trim();
      const effect = document.getElementById('newTiEffect').value.trim();
      if (!name) return;
      state.pl.threadItems.push({ name, type, effect, equipped: true });
      renderAll();
    }

    function updateThreadItem(idx, field, val) {
      if (!state.pl.threadItems[idx]) return;
      state.pl.threadItems[idx][field] = val;
      renderAll();
    }

    function removeThreadItem(idx) {
      state.pl.threadItems.splice(idx, 1);
      renderAll();
    }

    function removeWeapon(id) {
      state.pl.weapons = state.pl.weapons.filter(x => x.id !== id);
      renderMain();
    }

    function renderGmView() {
      const templatesHtml = state.monsterTemplates.map(t => `
        <div class="stat-box" style="text-align:left;">
          <div class="between" style="margin-bottom:6px;">
            <b style="font-size:14px;">${t.name}</b>
            <div class="row-flex">
              <span style="color:var(--accent); font-weight:700;">先攻 Step ${t.initStep}</span>
              <button class="btn btn-danger btn-sm" onclick="deleteTemplate('${t.id}')">删除</button>
            </div>
          </div>
          <div class="grid-4" style="font-size:11px; color:var(--muted); margin-bottom:8px;">
            <div>物理防御 <b style="color:var(--text);">${t.pd}</b></div>
            <div>秘法防御 <b style="color:var(--text);">${t.md}</b></div>
            <div>物理护甲 <b style="color:var(--text);">${t.pa}</b></div>
            <div>秘法护甲 <b style="color:var(--text);">${t.ma}</b></div>
            <div>攻击 <b style="color:var(--text);">Step ${t.atkStep}</b></div>
            <div>伤害 <b style="color:var(--text);">Step ${t.dmgStep}</b></div>
            <div>击倒 <b style="color:var(--text);">Step ${t.kdStep}</b></div>
            <div>回复 <b style="color:var(--text);">Step ${t.recStep}</b></div>
            <div>负伤阈值 <b style="color:var(--text);">${t.woundThreshold}</b></div>
            <div>意识丧失 <b style="color:var(--text);">${t.uncon}</b></div>
            <div>死亡 <b style="color:var(--danger);">${t.death}</b></div>
          </div>
          <div class="row-flex">
            <button class="btn btn-primary btn-sm" onclick="spawnMonster('${t.id}', 1)">加入战斗</button>
            <button class="btn btn-sm" onclick="spawnMonster('${t.id}', 3)">批量生成 ×3</button>
          </div>
        </div>
      `).join('');

      const activeMonstersHtml = state.monsters.length === 0
        ? '<div style="color:var(--muted); font-size:12px;">暂无已加入战斗的怪物，可从上方模板生成。</div>'
        : state.monsters.map(m => {
          const isDead = m.currentDamage >= m.death;
          return `
            <div class="stat-box" style="text-align:left; opacity:${isDead ? 0.55 : 1};">
              <div class="between" style="margin-bottom:4px;">
                <div>
                  <b>${m.name}</b>
                  ${isDead ? '<span class="badge badge-gm">死亡</span>' : ''}
                  ${m.knockedDown ? '<span class="badge badge-warn">倒地</span>' : ''}
                  ${m.blindsided ? '<span class="badge badge-warn">盲区</span>' : ''}
                  ${m.harried ? '<span class="badge badge-warn">受扰</span>' : ''}
                </div>
                <div class="row-flex">
                  <button class="btn btn-primary btn-sm" ${isDead ? 'disabled' : ''} onclick="monsterAttackPl('${m.instanceId}')">攻击</button>
                  <button class="btn btn-danger btn-sm" onclick="removeMonsterInstance('${m.instanceId}')">删除</button>
                </div>
              </div>
              <div class="between" style="font-size:11px; color:var(--muted);">
                <span>伤害 <b>${m.currentDamage}</b> / 意识丧失 ${m.uncon} / 死亡 ${m.death} · 负伤 <b>${m.wounds}</b></span>
                <div class="row-flex">
                  <span class="pill ${m.knockedDown ? 'active' : ''}" onclick="toggleMonsterFlag('${m.instanceId}','knockedDown')">倒地</span>
                  <span class="pill ${m.blindsided ? 'active' : ''}" onclick="toggleMonsterFlag('${m.instanceId}','blindsided')">盲区</span>
                  <span class="pill ${m.harried ? 'active' : ''}" onclick="toggleMonsterFlag('${m.instanceId}','harried')">受扰</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

      return `
        <div class="section">
          <div class="between" style="margin-bottom:8px;">
            <span class="section-title" style="margin:0;">怪物与惧魔模板</span>
            <button class="btn btn-sm" onclick="state.showAddMonsterForm=!state.showAddMonsterForm; renderMain();">+ 自定义怪物</button>
          </div>
          ${state.showAddMonsterForm ? `
            <form onsubmit="saveCustomMonster(event)" style="background:var(--card); padding:10px; border-radius:5px; margin-bottom:10px; border:1px solid var(--border);">
              <div class="grid-4" style="margin-bottom:8px;">
                <div class="field-group" style="grid-column: span 2;"><label>怪物名称</label><input name="name" placeholder="例如：血木劫掠者" required /></div>
                <div class="field-group"><label>先攻 Step</label><input type="number" name="initStep" value="7" /></div>
                <div class="field-group"><label>物理防御</label><input type="number" name="pd" value="10" /></div>
                <div class="field-group"><label>秘法防御</label><input type="number" name="md" value="9" /></div>
                <div class="field-group"><label>社交防御</label><input type="number" name="sd" value="7" /></div>
                <div class="field-group"><label>物理护甲</label><input type="number" name="pa" value="3" /></div>
                <div class="field-group"><label>秘法护甲</label><input type="number" name="ma" value="2" /></div>
                <div class="field-group"><label>攻击 Step</label><input type="number" name="atkStep" value="10" /></div>
                <div class="field-group"><label>伤害 Step</label><input type="number" name="dmgStep" value="11" /></div>
                <div class="field-group"><label>击倒 Step</label><input type="number" name="kdStep" value="7" /></div>
                <div class="field-group"><label>回复 Step</label><input type="number" name="recStep" value="6" /></div>
                <div class="field-group"><label>负伤阈值</label><input type="number" name="woundThreshold" value="8" /></div>
                <div class="field-group"><label>意识丧失</label><input type="number" name="uncon" value="30" /></div>
                <div class="field-group"><label>死亡</label><input type="number" name="death" value="38" /></div>
              </div>
              <div style="text-align:right;"><button type="submit" class="btn btn-primary">保存模板</button></div>
            </form>
          ` : ''}
          <div class="grid-2">${templatesHtml}</div>
        </div>

        <div class="section">
          <div class="section-title"><span>已加入战斗的怪物 (${state.monsters.length})</span></div>
          <div class="grid-2">${activeMonstersHtml}</div>
        </div>

        <div class="section">
          <div class="section-title"><span>快捷受创与击倒结算器</span></div>
          <div class="row-flex">
            <select id="calcTarget" style="width:160px;">
              <option value="pl">${state.pl.name}（PL）</option>
              ${state.monsters.map(m => `<option value="${m.instanceId}">${m.name}</option>`).join('')}
            </select>
            <input type="number" id="calcRawDmg" placeholder="原始伤害点数" style="width:110px;" />
            <select id="calcArmorType" style="width:100px;">
              <option value="pa">物理护甲</option>
              <option value="ma">秘法护甲</option>
            </select>
            <button class="btn btn-primary" onclick="manualApplyDamage()">结算受创</button>
          </div>
        </div>
      `;
    }

    function toggleMonsterFlag(instanceId, flag) {
      const m = state.monsters.find(x => x.instanceId === instanceId);
      if (!m) return;
      m[flag] = !m[flag];
      renderAll();
    }

    function manualApplyDamage() {
      const target = document.getElementById('calcTarget').value;
      const dmg = Number(document.getElementById('calcRawDmg').value) || 0;
      const armorType = document.getElementById('calcArmorType').value;
      if (dmg <= 0) return;
      if (target === 'pl') applyDamageToPl(dmg, armorType, false, false, '环境/直接伤害');
      else applyDamageToMonster(target, dmg, armorType, false, false, '直接伤害');
    }

    function renderStepTableView() {
      const rows = [];
      for (let i = 1; i <= 20; i++) {
        const s1 = getStepDice(i);
        const s2 = getStepDice(i + 20);
        rows.push(`
          <tr>
            <td class="clickable" onclick="quickRollStep(${i})"><b>Step ${i}</b></td>
            <td class="clickable" onclick="quickRollStep(${i})" style="color:var(--accent);">${s1.label}</td>
            <td class="clickable" onclick="quickRollStep(${i + 20})"><b>Step ${i + 20}</b></td>
            <td class="clickable" onclick="quickRollStep(${i + 20})" style="color:var(--accent);">${s2.label}</td>
          </tr>
        `);
      }
      return `
        <div class="section">
          <div class="section-title"><span>ED4E 官方 STEP 对照表（点击任意阶直接掷骰）</span></div>
          <table>
            <thead><tr><th>Step</th><th>行动骰</th><th>Step</th><th>行动骰</th></tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        </div>
      `;
    }

    function quickRollStep(step) {
      const res = rollStepTest(step, { isAction: true });
      addLog(`STEP表快捷掷骰 (Step ${step}) → ${res.total}`, res.trace);
    }

    function renderInitiative() {
      document.getElementById('roundNum').textContent = state.round;
      const container = document.getElementById('initList');
      if (state.initiativeList.length === 0) {
        container.innerHTML = '<div style="color:var(--muted); font-size:11px; padding:6px 0;">点击「全员投先攻」或角色卡「投先攻」生成序列</div>';
        return;
      }
      const d = calcPlDerived();
      container.innerHTML = state.initiativeList.map((item, idx) => {
        const isCurrent = idx === state.turnIndex;
        let hpInfo = '';
        let badges = '';
        if (item.type === 'pl') {
          hpInfo = `伤 ${state.pl.currentDamage}/${d.effUncon} · 负伤 ${state.pl.wounds}`;
          if (state.pl.statuses.knockedDown) badges += '<span class="badge badge-warn">倒地</span> ';
          if (state.pl.statuses.blindsided) badges += '<span class="badge badge-warn">盲区</span> ';
          if (state.pl.options.aggressive) badges += '<span class="badge badge-warn">猛攻</span> ';
          if (state.pl.options.defensive) badges += '<span class="badge">防御</span> ';
        } else {
          const m = state.monsters.find(x => x.instanceId === item.id);
          if (m) {
            hpInfo = state.gmBlind ? (m.wounds > 0 ? `负伤 ${m.wounds}` : '正常') : `伤 ${m.currentDamage}/${m.death} · 负伤 ${m.wounds}`;
            if (m.knockedDown) badges += '<span class="badge badge-warn">倒地</span> ';
            if (m.blindsided) badges += '<span class="badge badge-warn">盲区</span> ';
          }
        }
        return `
          <div class="init-item ${isCurrent ? 'current' : ''}">
            <div class="row-flex">
              <b style="color:var(--accent); min-width:22px;">${item.initVal}</b>
              <span class="badge ${item.type === 'pl' ? 'badge-pl' : 'badge-gm'}">${item.type === 'pl' ? 'PL' : 'GM'}</span>
              <b>${item.name}</b>
              ${badges}
            </div>
            <div class="row-flex">
              <span style="font-size:11px; color:var(--muted);">${hpInfo}</span>
              ${item.type === 'gm' ? `<button class="btn btn-danger btn-sm" onclick="removeMonsterInstance('${item.id}')">×</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderReaction() {
      const box = document.getElementById('reactionContainer');
      const pr = state.pendingReaction;
      if (!pr) {
        box.innerHTML = '';
        return;
      }
      const pl = state.pl;
      const canReact = pr.targetType === 'pl' && !pl.statuses.blindsided && !pl.statuses.knockedDown && !pl.statuses.surprised;
      box.innerHTML = `
        <div class="reaction-box">
          <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">待确认反应：${pr.attackerName} → ${pr.targetName}</div>
          <div style="font-size:11px; margin-bottom:6px;">${pr.attackName} 检定 <b>${pr.atkTotal}</b>（额外成功 +${pr.extraSuccesses}）</div>
          <div class="row-flex">
            <button class="btn btn-primary btn-sm" onclick="resolveReaction('accept')">直接承受</button>
            ${canReact ? `<button class="btn btn-sm" onclick="resolveReaction('avoid')">回避打击 (1劳累)</button>` : ''}
            ${canReact && pr.isMelee ? `<button class="btn btn-sm" onclick="resolveReaction('riposte')">反击 (2劳累)</button>` : ''}
          </div>
        </div>
      `;
    }

    function formatLogDetail(detail) {
      if (!detail) return '';
      const escaped = String(detail).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return escaped.replace(/(?:业力)?D\d+\[[^\]]*!→[^\]]*\]/g, (match) => {
        const boomCount = (match.match(/!→/g) || []).length;
        const cls = boomCount >= 2 ? 'explode-multi' : 'explode-once';
        return `<span class="${cls}" title="触发爆炸骰 (${boomCount}次)">${match}</span>`;
      });
    }

    function renderLogs() {
      const list = document.getElementById('logList');
      list.innerHTML = state.logs.map(l => `
        <div class="log-entry ${l.type}">
          <div class="between">
            <span>${l.text}</span>
            <span style="font-size:10px; color:var(--muted);">${l.time}</span>
          </div>
          ${l.detail ? `<div class="log-detail">${formatLogDetail(l.detail)}</div>` : ''}
        </div>
      `).join('');
    }

    function renderMain() {
      const main = document.getElementById('mainLeft');
      if (state.activeTab === 'pl') main.innerHTML = renderPlView();
      else if (state.activeTab === 'gm') main.innerHTML = renderGmView();
      else main.innerHTML = renderStepTableView();
    }

    function renderAll() {
      renderMain();
      renderInitiative();
      renderReaction();
      renderLogs();
    }

    // 远程图床/R2素材路径配置：若将 assets/ 上传至 Cloudflare R2 或图床，可直接把下方链接改为你的远程直链
    const THEME_REMOTE_ASSETS = {
      darkroom: '', // 例如: 'https://pub-xxx.r2.dev/banner-darkroom.jpg'
      marbled:  '', // 例如: 'https://pub-xxx.r2.dev/banner-marbled.jpg'
      xerox:    '', // 例如: 'https://pub-xxx.r2.dev/banner-xerox.jpg'
      tiles:    ''  // 例如: 'https://pub-xxx.r2.dev/banner-tiles.jpg'
    };

    function setCampaignTheme(themeId) {
      const valid = ['darkroom', 'marbled', 'xerox', 'tiles'].includes(themeId) ? themeId : 'darkroom';
      document.documentElement.setAttribute('data-theme', valid);
      document.body.setAttribute('data-theme', valid);
      const sel = document.getElementById('themeSelector');
      if (sel && sel.value !== valid) sel.value = valid;
      if (THEME_REMOTE_ASSETS[valid]) {
        document.documentElement.style.setProperty('--theme-banner-img', `url("${THEME_REMOTE_ASSETS[valid]}")`);
      } else {
        document.documentElement.style.removeProperty('--theme-banner-img');
      }
      try { localStorage.setItem('ed4_campaign_theme', valid); } catch (e) {}
    }

    (function initTheme() {
      let saved = 'darkroom';
      try { saved = localStorage.getItem('ed4_campaign_theme') || 'darkroom'; } catch (e) {}
      setCampaignTheme(saved);
    })();

    (function initResizer() {
      const resizer = document.getElementById('workspaceResizer');
      const sidebar = document.getElementById('sidebarRight');
      if (!resizer || !sidebar) return;
      try {
        const saved = localStorage.getItem('ed4_sidebar_width');
        if (saved && Number(saved) >= 280 && Number(saved) <= 720) {
          sidebar.style.width = saved + 'px';
        }
      } catch (e) {}

      let dragging = false;
      const startDrag = (e) => {
        dragging = true;
        resizer.classList.add('dragging');
        document.body.style.userSelect = 'none';
      };
      const onMove = (clientX) => {
        if (!dragging) return;
        const nextW = Math.max(280, Math.min(720, window.innerWidth - clientX));
        sidebar.style.width = nextW + 'px';
      };
      const stopDrag = () => {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove('dragging');
        document.body.style.userSelect = '';
        try { localStorage.setItem('ed4_sidebar_width', parseInt(sidebar.style.width, 10)); } catch (e) {}
      };
      resizer.addEventListener('mousedown', startDrag);
      window.addEventListener('mousemove', (e) => onMove(e.clientX));
      window.addEventListener('mouseup', stopDrag);
      resizer.addEventListener('touchstart', startDrag, { passive: true });
      window.addEventListener('touchmove', (e) => { if (e.touches[0]) onMove(e.touches[0].clientX); }, { passive: true });
      window.addEventListener('touchend', stopDrag);
    })();

    renderAll();
  </script>
</body>
</html>
