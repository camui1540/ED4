    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body[data-theme="xerox"] {
      background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    .brand, .section-title { font-family: var(--font-heading); }
    .section, .stat-box, .btn, .step-btn, .spell-card, input, select, textarea {
      border-radius: var(--radius);
      border-width: var(--border-w);
    }
    .btn, .step-btn, .stat-box, .pill, .spell-card {
      transition: transform 0.18s var(--spring), box-shadow 0.18s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled), .step-btn:hover:not(:disabled), .stat-box:hover {
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled), .step-btn:active:not(:disabled), .pill:active {
      transform: scale(0.95);
    }
    @keyframes logPulse {
      0% { transform: scale(0.98); opacity: 0.85; }
      55% { transform: scale(1.015); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .log-entry:first-child { animation: logPulse 0.26s var(--spring); }
    @media (prefers-reduced-motion: reduce) {
      .btn, .step-btn, .stat-box, .pill, .spell-card, .log-entry:first-child {
        transition: none !important;
        animation: none !important;
      }
    }
    .hero-banner {
      position: relative;
      overflow: hidden;
      background-image: var(--theme-banner-img);
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      margin: -10px -12px 10px -12px;
    }
    .hero-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--theme-scrim);
      z-index: 0;
    }
    .hero-banner > * {
      position: relative;
      z-index: 1;
    }
    body[data-theme="darkroom"] .hero-banner {
      border-bottom: 3px dotted #3a3a42;
    }
    body[data-theme="tiles"] .stat-box:nth-child(4n+1) { border-top: 3px solid #c87d20; }
    body[data-theme="tiles"] .stat-box:nth-child(4n+2) { border-top: 3px solid #528298; }
    body[data-theme="tiles"] .stat-box:nth-child(4n+3) { border-top: 3px solid #5c8a47; }
    body[data-theme="tiles"] .stat-box:nth-child(4n+4) { border-top: 3px solid #b54a33; }
    body[data-theme="xerox"] .stat-box,
    body[data-theme="xerox"] .section {
      box-shadow: 2px 2px 0 #222320;
    }
    header {
      height: 44px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: var(--card);
      border-color: var(--border);
      color: var(--text);
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .main-left {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .resizer {
      width: 6px;
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
    }
    .resizer:hover, .resizer.dragging {
      background: var(--accent);
    }
    .scroll-panel {
      max-height: 320px;
      overflow-y: auto;
      overflow-x: auto;
      padding-right: 4px;
      border: 1px solid rgba(46, 50, 56, 0.6);
      border-radius: 4px;
    }
    .sidebar-right {
      width: 380px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 8px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-val { font-size: 16px; font-weight: 700; margin: 2px 0; }
    .step-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .step-btn:hover { background: var(--accent); color: var(--accent-fg); }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 9px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { border-color: var(--accent); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
    }
    .btn-primary:hover { opacity: 0.9; background: var(--accent); }
    .btn-info {
      background: rgba(59,130,246,0.16);
      border-color: rgba(59,130,246,0.4);
      color: #60a5fa;
      font-weight: 600;
    }
    .btn-info:hover { background: rgba(59,130,246,0.25); }
    .btn-danger { color: var(--danger); border-color: rgba(239,68,68,0.35); }
    .btn-danger:hover { background: rgba(239,68,68,0.12); }
    .btn-sm { padding: 2px 6px; font-size: 11px; }
    .pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }
    .pill.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .pill.danger.active {
      background: rgba(239, 68, 68, 0.16);
      border-color: var(--danger);
      color: var(--danger);
    }
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-group label { font-size: 11px; color: var(--muted); }
    .row-flex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge-pl { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge-gm { background: rgba(239,68,68,0.2); color: #f87171; }
    .badge-warn { background: rgba(245,158,11,0.2); color: var(--accent); }
    .badge-ok { background: rgba(16,185,129,0.18); color: #34d399; }
    .init-box {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      max-height: 36%;
      overflow-y: auto;
    }
    .init-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 7px;
      border-radius: 4px;
      background: var(--card);
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .init-item.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .reaction-box {
      padding: 10px;
      background: rgba(245, 158, 11, 0.1);
      border-bottom: 1px solid var(--accent);
    }
    .log-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
    }
    .log-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .log-entry {
      background: var(--card);
      border-left: 3px solid var(--border);
      padding: 6px 8px;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
    }
    .log-entry.hit { border-left-color: var(--success); }
    .log-entry.fail { border-left-color: var(--danger); }
    .log-entry.warn { border-left-color: var(--accent); }
    .log-detail { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace; }
    .explode-once { color: #fb923c; font-weight: 700; }
    .explode-multi { color: #ef4444; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 5px 6px;
      text-align: left;
      font-size: 12px;
    }
    th { color: var(--muted); font-weight: 600; }
    tr.clickable:hover { background: var(--card); cursor: pointer; }
    .seg-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .seg-btn {
      background: var(--bg);
      border: none;
      color: var(--muted);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    .seg-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: min(820px, 96vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .spell-card.in-matrix {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.10) 0%, var(--card) 100%);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.25);
    }
    .spell-dropzone {
      border: 1px dashed transparent;
      border-radius: 6px;
      padding: 6px;
      transition: border-color 0.15s, background 0.15s;
    }
    .spell-dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.08);
    }
    .spell-card[draggable="true"] { cursor: grab; }
    .spell-card.dragging { opacity: 0.45; }
    .spell-card.drag-target { border-color: #60a5fa !important; box-shadow: 0 0 0 1px #60a5fa; }
    .spell-card.in-grimoire {
      opacity: 0.78;
      border-style: dashed;
    }
    .spell-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    @media (max-width: 1160px) {
      .grid-2-responsive { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 1040px) {
      .workspace { flex-direction: column; overflow-y: auto; }
      body { height: auto; overflow: auto; }
      .resizer { display: none; }
      .sidebar-right { width: 100% !important; border-left: none; border-top: 1px solid var(--border); max-height: 520px; }
      .grid-6 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

    ];

    const ATTR_NAMES = { DEX: '敏捷', STR: '力量', TOU: '强韧', PER: '感知', WIL: '意志', CHA: '魅力' };
    const ATTR_COST = { '-2': -2, '-1': -1, 0: 0, 1: 1, 2: 2, 3: 3, 4: 5, 5: 7, 6: 9, 7: 12, 8: 15 };
    const CARRY_TABLE = [10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 95, 110, 125, 140, 155, 175, 195, 215, 235, 255, 280, 305, 330, 355, 380, 410, 440, 470, 500, 530];

    const STEP_BASE = {
      1: { dice: [4], mod: -2, label: 'D4-2' },
      2: { dice: [4], mod: -1, label: 'D4-1' },
      3: { dice: [4], mod: 0, label: 'D4' },
      4: { dice: [6], mod: 0, label: 'D6' },
      5: { dice: [8], mod: 0, label: 'D8' },
      6: { dice: [10], mod: 0, label: 'D10' },
      7: { dice: [12], mod: 0, label: 'D12' }
    };

    const STEP_CYCLE = [
      { dice: [6, 6], label: '2D6' },
      { dice: [8, 6], label: 'D8+D6' },
      { dice: [8, 8], label: '2D8' },
      { dice: [10, 8], label: 'D10+D8' },
      { dice: [10, 10], label: '2D10' },
      { dice: [12, 10], label: 'D12+D10' },
      { dice: [12, 12], label: '2D12' },
      { dice: [12, 6, 6], label: 'D12+2D6' },
      { dice: [12, 8, 6], label: 'D12+D8+D6' },
      { dice: [12, 8, 8], label: 'D12+2D8' },
      { dice: [12, 10, 8], label: 'D12+D10+D8' }
    ];

    function getStepDice(step) {
      const s = Math.max(1, Math.floor(step));
      if (s <= 7) return STEP_BASE[s];
      const offset = s - 8;
      const d20Count = Math.floor(offset / 11);
      const rem = STEP_CYCLE[offset % 11];
      const dice = [];
      for (let i = 0; i < d20Count; i++) dice.push(20);
      dice.push(...rem.dice);
      const prefix = d20Count > 0 ? (d20Count === 1 ? 'D20+' : `${d20Count}D20+`) : '';
      return { dice, mod: 0, label: prefix + rem.label };
    }

    function attrToStep(val) {
      return Math.floor((Math.max(1, val) + 2) / 3) + 1;
    }

    function rollExplodingDie(sides) {
      let sum = 0;
      const rolls = [];
      while (true) {
        const r = Math.floor(Math.random() * sides) + 1;
        rolls.push(r);
        sum += r;
        if (r < sides) break;
      }
      const text = rolls.length > 1 ? `D${sides}[${rolls.join('!→')}]` : `D${sides}[${rolls[0]}]`;
      return { sum, first: rolls[0], text };
    }

    function rollStepTest(step, opts = {}) {
      const { karma = false, karmaDie = (state?.pl?.karmaDie || 6), dn = null, isAction = true } = opts;
      const cfg = getStepDice(step);
      const allDice = [...cfg.dice];
      if (karma) allDice.push(Number(karmaDie) || 6);
      let rawSum = 0;
      const traces = [];
      let allOnes = allDice.length >= 2;

      allDice.forEach((sides, idx) => {
        const res = rollExplodingDie(sides);
        rawSum += res.sum;
        if (res.first !== 1) allOnes = false;
        const tag = karma && idx === allDice.length - 1 ? `业力${res.text}` : res.text;
        traces.push(tag);
      });

      const total = Math.max(1, rawSum + cfg.mod);
      const isRuleOfOne = isAction && allOnes;
      let isSuccess = null;
      let extraSuccesses = 0;

      if (dn !== null && dn !== '' && !isNaN(Number(dn))) {
        const targetDn = Number(dn);
        if (isRuleOfOne) {
          isSuccess = false;
        } else if (total >= targetDn) {
          isSuccess = true;
          extraSuccesses = Math.floor((total - targetDn) / 5);
        } else {
          isSuccess = false;
        }
      }

      const modStr = cfg.mod !== 0 ? (cfg.mod > 0 ? `+${cfg.mod}` : `${cfg.mod}`) : '';
      return {
        step: Math.max(1, Math.floor(step)),
        diceLabel: cfg.label + (karma ? `+业力D${karmaDie}` : ''),
        total,
        isRuleOfOne,
        isSuccess,
        extraSuccesses,
        trace: `${traces.join(' + ')}${modStr} = ${total}`
      };
    }

    const state = {

    function getDisciplineBonuses(disciplineId, circle) {
      const disc = DISCIPLINES[disciplineId] || DISCIPLINES.swordmaster;
      const c = Math.max(1, Math.min(15, Number(circle) || 1));
      let pd = 0, md = 0, sd = 0, init = 0, rec = 0, ma = 0;
      for (let i = 1; i <= c; i++) {
        const b = disc.bonuses[i];
        if (!b) continue;
        if (b.pd) pd = Math.max(pd, b.pd);
        if (b.md) md = Math.max(md, b.md);
        if (b.sd) sd = Math.max(sd, b.sd);
        if (b.init) init += b.init;
        if (b.rec) rec += b.rec;
        if (b.ma) ma += b.ma;
      }
      const durabilityTotal = disc.durability * c;
      return { disc, circle: c, durabilityTotal, pd, md, sd, init, rec, ma };
    }

    function parseItemBonuses(text) {
      const b = { pa: 0, ma: 0, pd: 0, md: 0, sd: 0, init: 0, DEX: 0, STR: 0, TOU: 0, PER: 0, WIL: 0, CHA: 0 };
      const s = String(text || '');
      if (!s) return b;
      const sumMatches = (re) => {
        let total = 0;
        let m;
        while ((m = re.exec(s)) !== null) total += Number(m[1]) || 0;
        return total;
      };
      b.pa = sumMatches(/物理护甲\s*([+-]?\d+)/g);
      b.ma = sumMatches(/秘法护甲\s*([+-]?\d+)/g);
      b.pd = sumMatches(/物理防御\s*([+-]?\d+)/g);
      b.md = sumMatches(/秘法防御\s*([+-]?\d+)/g);
      b.sd = sumMatches(/社交防御\s*([+-]?\d+)/g);
      b.init = sumMatches(/先攻\s*([+-]?\d+)/g);
      b.DEX = sumMatches(/(?:敏捷|DEX)\s*([+-]?\d+)/gi);
      b.STR = sumMatches(/(?:力量|STR)\s*([+-]?\d+)/gi);
      b.TOU = sumMatches(/(?:强韧|TOU)\s*([+-]?\d+)/gi);
      b.PER = sumMatches(/(?:感知|PER)\s*([+-]?\d+)/gi);
      b.WIL = sumMatches(/(?:意志|WIL)\s*([+-]?\d+)/gi);
      b.CHA = sumMatches(/(?:魅力|CHA)\s*([+-]?\d+)/gi);
      return b;
    }

    function calcEquippedBonuses(gear = [], threadItems = []) {
      const total = { pa: 0, ma: 0, pd: 0, md: 0, sd: 0, init: 0, DEX: 0, STR: 0, TOU: 0, PER: 0, WIL: 0, CHA: 0 };
      [...(gear || []), ...(threadItems || [])].forEach(item => {
        if (!item || item.equipped === false) return;
        const b = parseItemBonuses(`${item.name || ''} ${item.effect || ''}`);
        for (const k of Object.keys(total)) total[k] += b[k];
      });
      return total;
    }

    function calcPlDerived() {
      const pl = state.pl;
      const race = RACES[pl.raceId] || RACES.human;
      const prog = getDisciplineBonuses(pl.disciplineId, pl.circle);
      const attrs = {};
      const steps = {};
      let spentPoints = 0;

      const itemBonuses = calcEquippedBonuses(pl.gear, pl.threadItems);

      for (const k of Object.keys(ATTR_NAMES)) {
        const mod = pl.attrMods[k] || 0;
        spentPoints += ATTR_COST[mod] !== undefined ? ATTR_COST[mod] : mod;
        attrs[k] = race.base[k] + mod + (itemBonuses[k] || 0);
        steps[k] = attrToStep(attrs[k]);
      }

      const remainingPoints = 25 - spentPoints;
      const karmaMax = race.karmaMod * prog.circle + Math.max(0, remainingPoints);

      let pd = Math.floor((attrs.DEX + 3) / 2) + (race.pdBonus || 0) + prog.pd + (itemBonuses.pd || 0);
      let md = Math.floor((attrs.PER + 3) / 2) + prog.md + (itemBonuses.md || 0);
      let sd = Math.floor((attrs.CHA + 3) / 2) + prog.sd + (itemBonuses.sd || 0);

      if (!pl.statuses.blindsided) {
        pd += Number(pl.shield.pd) || 0;
        md += Number(pl.shield.md) || 0;
      }
      if (pl.options.aggressive) { pd -= 3; md -= 3; }
      if (pl.options.defensive) { pd += 3; md += 3; }
      if (pl.statuses.knockedDown) { pd -= 3; md -= 3; }
      if (pl.statuses.blindsided) { pd -= 2; md -= 2; }
      if (pl.statuses.surprised) { pd -= 3; md -= 3; }
      if (pl.statuses.harried || pl.options.splitMove) { pd -= 2; md -= 2; }

      const pa = (Number(pl.armor.pa) || 0) + (race.naturalArmor || 0) + (itemBonuses.pa || 0);
      const ma = Math.floor(attrs.WIL / 5) + (Number(pl.armor.ma) || 0) + prog.ma + (itemBonuses.ma || 0);

      const totalDurability = prog.durabilityTotal + (Number(pl.durabilityBonus) || 0);
      const baseUncon = attrs.TOU * 2 + totalDurability;
      const baseDeath = attrs.TOU * 2 + steps.TOU + prog.circle + totalDurability;
      const effUncon = Math.max(1, baseUncon - (Number(pl.bloodDamage) || 0));
      const effDeath = Math.max(1, baseDeath - (Number(pl.bloodDamage) || 0));
      const woundThreshold = Math.floor((attrs.TOU + 5) / 2) + (race.woundBonus || 0);
      const recoveryMax = Math.ceil(attrs.TOU / 6) + prog.rec;

      const initPen = (Number(pl.armor.initPen) || 0) + (Number(pl.shield.initPen) || 0);
      const initStep = Math.max(1, steps.DEX - initPen + (Number(pl.initBonus) || 0) + prog.init + (itemBonuses.init || 0));

      const strCarryIdx = Math.min(30, Math.max(1, attrs.STR + (pl.raceId === 'dwarf' ? 2 : 0))) - 1;
      const carry = CARRY_TABLE[strCarryIdx];

      return {
        race, prog, attrs, steps, remainingPoints, karmaMax,
        pd: Math.max(1, pd), md: Math.max(1, md), sd: Math.max(1, sd),
        pa, ma, baseUncon, baseDeath, effUncon, effDeath,
        woundThreshold, recoveryMax, initStep, carry, totalDurability
      };
    }

    function getPlActionMod() {
      const pl = state.pl;
      let mod = -pl.wounds;
      if (pl.options.defensive) mod -= 3;
      if (pl.options.tailAttack) mod -= 2;
      if (pl.statuses.knockedDown) mod -= 3;
      if (pl.statuses.harried || pl.options.splitMove) mod -= 2;
      return mod;
    }

    function addLog(text, detail = '', type = '', blindText = '') {
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      state.logs.unshift({
        id: Date.now() + Math.random(),
        time,
        text: state.gmBlind && blindText ? blindText : text,
        detail: state.gmBlind && blindText ? '（GM脱敏模式已隐藏具体抗性与阈值）' : detail,
        type
      });
      if (state.logs.length > 60) state.logs.pop();
      renderLogs();
    }

    function clearLogs() {
      state.logs = [];
      renderLogs();

    function switchTab(tab) {

    function changeDiscipline(disciplineId) {
      if (!DISCIPLINES[disciplineId]) return;
      state.pl.disciplineId = disciplineId;
      const d = calcPlDerived();
      state.pl.karmaCurrent = Math.min(state.pl.karmaCurrent, d.karmaMax);
      state.pl.recoveryCurrent = Math.min(state.pl.recoveryCurrent, d.recoveryMax);
      addLog(`切换门类为【${d.prog.disc.name}】，耐久加值 +${d.prog.durabilityTotal}`, `意识丧失 ${d.effUncon} / 死亡 ${d.effDeath} · 业力上限 ${d.karmaMax}`);
      renderAll();
    }

    function changeCircle(val) {
      const c = Math.max(1, Math.min(15, Math.floor(Number(val) || 1)));
      state.pl.circle = c;
      if (c >= 9 && state.pl.karmaDie === 6) {
        state.pl.karmaDie = 8;
      }
      const d = calcPlDerived();
      state.pl.karmaCurrent = d.karmaMax;
      state.pl.recoveryCurrent = d.recoveryMax;
      addLog(`调整环数为第 ${c} 环（${d.prog.disc.name}），耐久 +${d.prog.durabilityTotal}`, `意识丧失 ${d.effUncon} / 死亡 ${d.effDeath} · 业力上限 ${d.karmaMax} (D${state.pl.karmaDie})`);
      renderAll();
    }

    function setKarmaDie(die) {
      state.pl.karmaDie = die === 8 ? 8 : 6;
      renderAll();
    }

    function adjustAttr(attr, delta) {
      const cur = state.pl.attrMods[attr];
      const next = cur + delta;
      if (next < -2 || next > 8) return;
      const d = calcPlDerived();
      const costDiff = ATTR_COST[next] - ATTR_COST[cur];
      if (d.remainingPoints - costDiff < 0) return;
      state.pl.attrMods[attr] = next;
      const updated = calcPlDerived();
      state.pl.karmaCurrent = Math.min(state.pl.karmaCurrent, updated.karmaMax);
      state.pl.recoveryCurrent = Math.min(state.pl.recoveryCurrent, updated.recoveryMax);
      renderAll();
    }

    function changeRace(raceId) {
      state.pl.raceId = raceId;
      if (raceId !== 'tskrang') state.pl.options.tailAttack = false;
      const d = calcPlDerived();
      state.pl.karmaCurrent = d.karmaMax;
      state.pl.recoveryCurrent = d.recoveryMax;
      renderAll();
    }

    function rollAttribute(attr) {
      const d = calcPlDerived();
      const step = Math.max(1, d.steps[attr] + getPlActionMod());
      const res = rollStepTest(step, { isAction: true });
      addLog(`${state.pl.name} 进行 ${ATTR_NAMES[attr]}检定 (Step ${step}) → ${res.total}${res.isRuleOfOne ? ' [全一规则大失败]' : ''}`, res.trace, res.isRuleOfOne ? 'fail' : '');
    }

    function rollPlInitiative() {
      const d = calcPlDerived();
      const step = Math.max(1, d.initStep + getPlActionMod());
      const res = rollStepTest(step, { isAction: false });
      const idx = state.initiativeList.findIndex(x => x.type === 'pl');
      const entry = { id: 'pl', type: 'pl', name: state.pl.name, initVal: res.total, initStep: step, dexVal: d.attrs.DEX };
      if (idx >= 0) state.initiativeList[idx] = entry;
      else state.initiativeList.push(entry);
      sortInitiative();
      addLog(`${state.pl.name} 投掷先攻 (Step ${step}) → ${res.total}`, res.trace, 'warn');
      renderInitiative();
    }

    function rollQuickCheck(type) {
      const d = calcPlDerived();
      const pl = state.pl;
      if (type === 'init') {
        rollPlInitiative();
        return;
      }
      if (type === 'recovery') {
        if (pl.recoveryCurrent <= 0) {
          addLog(`${pl.name} 今日回复次数已耗尽`, '', 'fail');
          return;
        }
        pl.recoveryCurrent--;
        const step = Math.max(1, d.steps.TOU - pl.wounds);
        const res = rollStepTest(step, { isAction: false });
        const healed = Math.max(1, res.total);
        pl.currentDamage = Math.max(0, pl.currentDamage - healed);
        addLog(`${pl.name} 进行回复检定 (Step ${step}) → 恢复 ${healed} 点伤害 (剩余次数 ${pl.recoveryCurrent})`, res.trace, 'hit');
        renderAll();
        return;
      }
      if (type === 'knockdown') {
        const wb = pl.talents.find(t => t.name.includes('负伤平衡') || t.name.toLowerCase().includes('wound balance'));
        const step = Math.max(1, d.steps.STR + (wb ? wb.rank : 0) + getPlActionMod());
        const res = rollStepTest(step, { isAction: true });
        addLog(`${pl.name} 进行击倒检定${wb ? `（含负伤平衡 ${wb.rank} 级）` : ''} (Step ${step}) → ${res.total}`, res.trace);
        return;
      }
      if (type === 'jumpup') {
        if (!pl.statuses.knockedDown) return;
        pl.currentDamage += 2;
        const step = Math.max(1, d.steps.DEX - ((Number(pl.armor.initPen) || 0) + (Number(pl.shield.initPen) || 0)) - pl.wounds);
        const res = rollStepTest(step, { dn: 6, isAction: true });
        if (res.isSuccess) pl.statuses.knockedDown = false;
        addLog(`${pl.name} 尝试跃起（承受 2 劳累值，难度 6）→ ${res.isSuccess ? '成功起身' : '起身失败'} (${res.total})`, res.trace, res.isSuccess ? 'hit' : 'fail');
        renderAll();
        return;
      }
      const map = {
        awareness: { label: '察觉/防埋伏检定', step: d.steps.PER },
        astral: { label: '星界感知检定', step: d.steps.PER },
        willpower: { label: '意志抵抗检定', step: d.steps.WIL }
      };
      const item = map[type];
      const step = Math.max(1, item.step + getPlActionMod());
      const res = rollStepTest(step, { isAction: true });
      addLog(`${pl.name} 进行${item.label} (Step ${step}) → ${res.total}`, res.trace);
    }

    function healWoundRest() {
      const pl = state.pl;
      if (pl.currentDamage > 0 || pl.wounds <= 0 || pl.recoveryCurrent <= 0) return;
      pl.recoveryCurrent--;
      pl.wounds--;
      addLog(`${pl.name} 整夜休整并消耗 1 次回复检定，消除 1 处负伤（剩余负伤 ${pl.wounds}）`, '', 'hit');
      renderAll();
    }

    function karmaRitual() {
      const d = calcPlDerived();
      state.pl.karmaCurrent = d.karmaMax;
      addLog(`${state.pl.name} 完成半小时业力仪式，业力点数恢复至上限 ${d.karmaMax}`, '', 'hit');
      renderAll();
    }

    function toggleOption(key) {
      const opts = state.pl.options;
      if (key === 'aggressive' && !opts.aggressive) opts.defensive = false;
      if (key === 'defensive' && !opts.defensive) opts.aggressive = false;
      opts[key] = !opts[key];
      if (key === 'splitMove' && opts.splitMove) state.pl.currentDamage += 1;
      renderAll();
    }

    function toggleStatus(key) {
      state.pl.statuses[key] = !state.pl.statuses[key];
      renderAll();
    }

    function rollTalentOrSkill(listType, itemId) {
      const pl = state.pl;
      const list = listType === 'skill' ? pl.skills : pl.talents;
      const t = list.find(x => x.id === itemId);
      if (!t) return;
      if (pl.statuses.surprised) {
        addLog(`${pl.name} 处于惊愕状态，本轮无法执行检定`, '', 'fail');
        return;
      }
      const d = calcPlDerived();
      const useKarma = listType === 'talent' && document.getElementById(`karma_${t.id}`)?.checked && pl.karmaCurrent > 0;
      if (useKarma) pl.karmaCurrent--;

      let strainCost = Number(t.strain) || 0;
      if (t.isAttack && pl.options.aggressive) strainCost += 1;
      if (strainCost > 0) pl.currentDamage += strainCost;

      let step = d.steps[t.attr] + t.rank + getPlActionMod();
      if (t.isAttack && pl.options.aggressive) step += 3;
      step = Math.max(1, step);

      const targetSelect = document.getElementById('plTargetSelect')?.value || '';
      let targetMonster = null;
      let dn = null;
      if (targetSelect.startsWith('m:')) {
        targetMonster = state.monsters.find(m => m.instanceId === targetSelect.slice(2));
        if (targetMonster) dn = getMonsterEffectiveDef(targetMonster, 'pd');
      } else if (targetSelect.startsWith('dn:')) {
        dn = Number(targetSelect.slice(3));
      }

      const res = rollStepTest(step, { karma: useKarma, karmaDie: pl.karmaDie, dn, isAction: true });
      const strainText = strainCost > 0 ? ` [劳累 +${strainCost}]` : '';
      const tag = listType === 'skill' ? '技能' : '天赋';

      if (dn === null) {
        addLog(`${pl.name} 使用${tag}【${t.name}】 (Step ${step})${strainText} → ${res.total}${res.isRuleOfOne ? ' [全一规则大失败]' : ''}`, res.trace, res.isRuleOfOne ? 'fail' : '');
        renderAll();
        return;
      }

      if (!res.isSuccess) {
        addLog(
          `${pl.name} 使用${tag}【${t.name}】攻击 ${targetMonster ? targetMonster.name : '目标'} → 未命中 (${res.total} vs ${dn})${strainText}`,
          res.trace,
          'fail',
          `${pl.name} 使用${tag}【${t.name}】攻击目标 → 未命中 (${res.total})${strainText}`
        );
        renderAll();
        return;
      }

      state.lastExtraDamageBonus = res.extraSuccesses * 2;
      const weapon = pl.weapons[0] || { name: '徒手', dmgStep: 0 };
      let dmgStep = d.steps.STR + (Number(weapon.dmgStep) || 0) + (pl.options.aggressive ? 3 : 0);

      if (targetMonster) {
        state.pendingReaction = {
          attackerId: 'pl',
          attackerType: 'pl',
          attackerName: pl.name,
          targetId: targetMonster.instanceId,
          targetType: 'gm',
          targetName: targetMonster.name,
          attackName: `${t.name}（${weapon.name}）`,
          atkTotal: res.total,
          targetDef: dn,
          extraSuccesses: res.extraSuccesses,
          dmgStep,
          isMelee: true,
          isKnockdownOpt: pl.options.knockdown,
          isStunOpt: pl.options.stun,
          armorType: 'pa'
        };
      }

      addLog(
        `${pl.name} 使用${tag}【${t.name}】命中 ${targetMonster ? targetMonster.name : '目标'} (${res.total} vs ${dn}，额外成功 +${res.extraSuccesses})${strainText}`,
        res.trace,
        'hit',
        `${pl.name} 使用${tag}【${t.name}】命中目标（额外成功 +${res.extraSuccesses}）${strainText}`
      );
      renderAll();
    }

    function rollTalent(talentId) {
      rollTalentOrSkill('talent', talentId);
    }

    function rollSkill(skillId) {
      rollTalentOrSkill('skill', skillId);
    }

    function rollWeaponDamage(weaponId) {
      const pl = state.pl;
      const w = pl.weapons.find(x => x.id === weaponId);
      if (!w) return;
      const d = calcPlDerived();
      const dmgStep = Math.max(1, d.steps.STR + (Number(w.dmgStep) || 0) + (pl.options.aggressive ? 3 : 0));
      const res = rollStepTest(dmgStep, { isAction: false });
      const bonus = state.lastExtraDamageBonus || 0;
      const totalDmg = res.total + bonus;
      state.lastExtraDamageBonus = 0;

      const targetSelect = document.getElementById('plTargetSelect')?.value || '';
      if (targetSelect.startsWith('m:')) {
        const m = state.monsters.find(x => x.instanceId === targetSelect.slice(2));
        if (m) {
          applyDamageToMonster(m.instanceId, totalDmg, 'pa', pl.options.knockdown, pl.options.stun, `${pl.name}【${w.name}】`);
          return;
        }
      }
      addLog(`${pl.name} 掷出【${w.name}】伤害 (Step ${dmgStep}) → ${totalDmg} 点${bonus ? `（含额外成功 +${bonus}）` : ''}`, res.trace, 'hit');
      renderAll();
    }

    const SPELL_ALIASES = {
      '星界长矛': 'net_astral_spear',
      '星界之矛': 'net_astral_spear',
      '精神飞刺': 'net_spirit_dart',
      '夜之矢': 'net_arrow_of_night',
      '星质矛': 'net_astral_spear',
      '灵魂甲': 'net_soul_armor',
      '精神镖': 'net_spirit_dart',
      '恐惧迷雾': 'net_fog_of_fear',
      '夜箭': 'net_arrow_of_night',
      '夜之箭': 'net_arrow_of_night',
      '迷雾幽魂': 'net_aspect_fog_ghost',
      '残酷医者': 'net_aspect_physician',
      '险恶暴君': 'net_aspect_tyrant',
      '枯萎术': 'net_wither_limb',
      '凋零': 'net_wither_limb',
      '火球': 'ele_fireball',
      '闪电': 'ele_lightning_bolt',
      '法师甲': 'wiz_mage_armor',
      '心灵匕': 'wiz_mind_dagger'
    };

    function findSpellInDb(name) {
      const raw = (name || '').trim();
      if (!raw) return null;
      const clean = raw.toLowerCase().replace(/[（）()【】\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
      // 1. Exact or substring match against English and Chinese names
      const direct = SPELLS_DB.find(s => {
        const cn = s.nameCn.toLowerCase();
        const en = s.nameEn.toLowerCase();
        return cn === clean || en === clean ||
          (clean.length >= 2 && (cn.includes(clean) || clean.includes(cn))) ||
          (en && clean.length >= 3 && (en.includes(clean) || clean.includes(en)));
      });
      if (direct) return direct;
      // 2. Alias match
      for (const [alias, id] of Object.entries(SPELL_ALIASES)) {
        if (clean.includes(alias)) {
          return SPELLS_DB.find(s => s.id === id) || null;
        }
      }
      return null;
    }

    function addSpellFromDb() {
      const sel = document.getElementById('spellDbSelect');
      const spellId = sel?.value;
      const tpl = SPELLS_DB.find(s => s.id === spellId);
      if (!tpl) return;
      const matrixCount = (state.pl.spells || []).filter(s => s.inMatrix).length;
      state.pl.spells.push({ ...tpl, instanceId: 'sp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), wovenThreads: 0, inMatrix: matrixCount < 3 });
      renderMain();
    }

    let draggedSpellId = null;

    function onSpellDragStart(e, instanceId) {
      draggedSpellId = instanceId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', instanceId);
      e.currentTarget.classList.add('dragging');
    }

    function onSpellDragEnd(e) {
      draggedSpellId = null;
      document.querySelectorAll('.spell-card.dragging, .spell-card.drag-target, .spell-dropzone.drag-over').forEach(el => {
        el.classList.remove('dragging', 'drag-target', 'drag-over');
      });
    }

    function onSpellZoneDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function onSpellZoneDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onSpellZoneDrop(e, targetInMatrix) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const id = draggedSpellId || e.dataTransfer.getData('text/plain');
      const sp = state.pl.spells.find(s => s.instanceId === id);
      if (!sp) return;
      if (sp.inMatrix !== targetInMatrix) {
        sp.inMatrix = targetInMatrix;
        if (!targetInMatrix) sp.wovenThreads = 0;
        renderMain();
      }
    }

    function onSpellCardDrop(e, targetId) {
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.remove('drag-target');
      const srcId = draggedSpellId || e.dataTransfer.getData('text/plain');
      if (!srcId || srcId === targetId) return;
      const src = state.pl.spells.find(s => s.instanceId === srcId);
      const dst = state.pl.spells.find(s => s.instanceId === targetId);
      if (!src || !dst) return;
      const tmp = src.inMatrix !== false;
      src.inMatrix = dst.inMatrix !== false;
      dst.inMatrix = tmp;
      if (!src.inMatrix) src.wovenThreads = 0;
      if (!dst.inMatrix) dst.wovenThreads = 0;
      renderMain();
    }

    function toggleSpellMatrix(instanceId) {
      const sp = state.pl.spells.find(s => s.instanceId === instanceId);
      if (!sp) return;
      sp.inMatrix = !sp.inMatrix;
      if (!sp.inMatrix) sp.wovenThreads = 0;
      renderMain();
    }

    function swapSpellIntoMatrix(grimoireInstanceId, targetMatrixId) {
      const grim = state.pl.spells.find(s => s.instanceId === grimoireInstanceId);
      if (!grim) return;
      if (targetMatrixId) {
        const old = state.pl.spells.find(s => s.instanceId === targetMatrixId);
        if (old) {
          old.inMatrix = false;
          old.wovenThreads = 0;
        }
      }
      grim.inMatrix = true;
      addLog(`已将【${grim.nameCn}】装入常备法术矩阵`, '', 'hit');
      renderMain();
    }

    function removeSpell(instanceId) {
      state.pl.spells = state.pl.spells.filter(s => s.instanceId !== instanceId);
      renderMain();
    }

    function getSpellcastingStep() {
      const pl = state.pl;
      const d = calcPlDerived();
      const t = pl.talents.find(x => x.name.includes('施法') || x.name.toLowerCase().includes('spellcasting'));
      const rank = t ? t.rank : 0;
      return { step: Math.max(1, d.steps.PER + rank + getPlActionMod()), rank };
    }

    const WEAVING_KEYWORDS = [
      '脉路编织', '元素编织', '幻术编织', '下界编织', '巫术编织',
      '武器编织', '战争编织', '天空编织', '骑乘编织', '野兽编织',
      '航行编织', '箭矢编织', '斥候编织', '窃贼编织', '故事编织', '匠脉编织',
      '元素主义', '幻术', '下界术', '巫术',
      'thread weaving', 'elementalism', 'illusionism', 'nethermancy', 'wizardry',
      'air weaving', 'arrow weaving', 'beast weaving', 'rider weaving',
      'scout weaving', 'sky weaving', 'weapon weaving', 'thief weaving',
      'story weaving', 'war weaving', 'thread smithing'
    ];

    function hasSpellEffectRoll(sp) {
      if (!sp) return false;
      const f = String(sp.effectFormula || '').toUpperCase();
      return sp.effectType === 'damage' || f.includes('WIL') || f.includes('CIRCLE');
    }

    function getThreadWeavingStep() {
      const pl = state.pl;
      const d = calcPlDerived();
      const t = pl.talents.find(x => {
        const nm = (x.name || '').toLowerCase();
        return nm.includes('编织') || WEAVING_KEYWORDS.some(k => nm.includes(k));
      });
      const rank = t ? t.rank : 0;
      return { step: Math.max(1, d.steps.PER + rank + getPlActionMod()), rank, talentName: t ? t.name : '脉路编织' };
    }

    function useSpellKarma(instanceId) {
      const pl = state.pl;
      const checked = document.getElementById(`karma_sp_${instanceId}`)?.checked && pl.karmaCurrent > 0;
      if (checked) pl.karmaCurrent--;
      return checked;
    }

    function weaveSpellThread(instanceId) {
      const sp = state.pl.spells.find(s => s.instanceId === instanceId);
      if (!sp) return;
      const tw = getThreadWeavingStep();
      const dn = Number(sp.weavingBase) || 5;
      const useKarma = useSpellKarma(instanceId);
      const res = rollStepTest(tw.step, { karma: useKarma, karmaDie: state.pl.karmaDie, dn, isAction: true });
      if (res.isSuccess) {
        const gained = 1 + res.extraSuccesses;
        sp.wovenThreads = Math.min((Number(sp.threads) || 0) + 4, (sp.wovenThreads || 0) + gained);
        addLog(`${state.pl.name} 为【${sp.nameCn}】编织脉路 (Step ${tw.step} vs ${dn}) → 成功 (+${gained} 脉路，当前 ${sp.wovenThreads}/${sp.threads})`, res.trace, 'hit');
      } else {
        addLog(`${state.pl.name} 为【${sp.nameCn}】编织脉路 (Step ${tw.step} vs ${dn}) → 失败 (当前 ${sp.wovenThreads || 0}/${sp.threads})`, res.trace, 'fail');
      }
      renderAll();
    }

    function castSpell(instanceId) {
      const sp = state.pl.spells.find(s => s.instanceId === instanceId);
      if (!sp) return;
      const reqThreads = Number(sp.threads) || 0;
      const curThreads = Number(sp.wovenThreads) || 0;
      if (reqThreads > 0 && curThreads < reqThreads) {
        addLog(`${state.pl.name} 无法施放【${sp.nameCn}】：尚需编织脉路（当前 ${curThreads}/${reqThreads}），请先点击「编织脉路」`, '', 'warn');
        return;
      }

      const pl = state.pl;
      const sc = getSpellcastingStep();
      const targetSelect = document.getElementById('plTargetSelect')?.value || '';
      let targetMonster = null;
      let targetGroup = [];
      let dn = sp.castingType === 'fixed' ? (Number(sp.castingDn) || 6) : null;
      let targetLabel = '目标';

      if (sp.castingType !== 'fixed') {
        if (targetSelect === 'aoe:all') {
          targetGroup = state.monsters.filter(m => m.currentDamage < m.death);
          if (targetGroup.length > 0) {
            dn = Math.max(...targetGroup.map(m => getMonsterEffectiveDef(m, 'md')));
            targetLabel = `全场敌方 (${targetGroup.length}名，最高秘防 ${dn})`;
          }
        } else if (targetSelect.startsWith('m:')) {
          targetMonster = state.monsters.find(m => m.instanceId === targetSelect.slice(2));
          if (targetMonster) {
            dn = getMonsterEffectiveDef(targetMonster, 'md');
            targetLabel = targetMonster.name;
          }
        } else if (targetSelect.startsWith('dn:')) {
          dn = Number(targetSelect.slice(3));
          targetLabel = `固定难度 ${dn}`;
        }
      }

      const useKarma = useSpellKarma(instanceId);
      const res = rollStepTest(sc.step, { karma: useKarma, karmaDie: pl.karmaDie, dn, isAction: true });
      sp.wovenThreads = 0;

      if (dn === null) {
        addLog(`${pl.name} 施放【${sp.nameCn}】 (Step ${sc.step}) → ${res.total}`, res.trace, '');
        renderAll();
        return;
      }

      if (!res.isSuccess) {
        addLog(
          `${pl.name} 对 ${targetLabel} 施放【${sp.nameCn}】 → 失败 (${res.total} vs ${dn})`,
          res.trace,
          'fail',
          `${pl.name} 施放【${sp.nameCn}】 → 未命中 (${res.total})`
        );
        renderAll();
        return;
      }

      state.lastExtraDamageBonus = res.extraSuccesses * 2;
      const suffixHint = hasSpellEffectRoll(sp) ? '，请点击「结算效果」掷效果骰' : `，法术效果已直接生效（${sp.effectFormula}）`;
      addLog(
        `${pl.name} 对 ${targetLabel} 成功施放【${sp.nameCn}】 (${res.total} vs ${dn}，额外成功 +${res.extraSuccesses})${suffixHint}`,
        res.trace,
        'hit',
        `${pl.name} 成功施放【${sp.nameCn}】（额外成功 +${res.extraSuccesses}）${suffixHint}`
      );
      renderAll();
    }

    function rollSpellEffect(instanceId) {
      const sp = state.pl.spells.find(s => s.instanceId === instanceId);
      if (!sp) return;
      const pl = state.pl;
      const d = calcPlDerived();
      const willforce = pl.talents.find(t => t.name.includes('意志力') || t.name.toLowerCase().includes('willforce'));
      const baseWilStep = willforce ? (d.steps.WIL + willforce.rank) : d.steps.WIL;
      if (willforce) pl.currentDamage += 1;

      let effStep = baseWilStep;
      const f = (sp.effectFormula || '').toUpperCase();
      const mWil = f.match(/WIL\s*\+\s*(\d+)/);
      const mCir = f.match(/CIRCLE\s*\+\s*(\d+)/);
      if (mWil) effStep = baseWilStep + Number(mWil[1]);
      else if (mCir) effStep = pl.circle + Number(mCir[1]);

      const useKarma = useSpellKarma(instanceId);
      const res = rollStepTest(effStep, { karma: useKarma, karmaDie: pl.karmaDie, isAction: false });
      const bonus = state.lastExtraDamageBonus || 0;
      const total = res.total + bonus;
      state.lastExtraDamageBonus = 0;

      if (sp.effectType === 'damage') {
        const targetSelect = document.getElementById('plTargetSelect')?.value || '';
        if (targetSelect === 'aoe:all') {
          const alive = state.monsters.filter(m => m.currentDamage < m.death);
          if (alive.length > 0) {
            addLog(`${pl.name} 掷出群体法术【${sp.nameCn}】效果伤害 (Step ${effStep}) → ${total} 点${bonus ? `（含额外成功 +${bonus}）` : ''}`, res.trace, 'hit');
            alive.forEach(m => applyDamageToMonster(m.instanceId, total, sp.armorType || 'ma', false, false, `${pl.name}【${sp.nameCn}】`));
            return;
          }
        } else if (targetSelect.startsWith('m:')) {
          const m = state.monsters.find(x => x.instanceId === targetSelect.slice(2));
          if (m) {
            applyDamageToMonster(m.instanceId, total, sp.armorType || 'ma', false, false, `${pl.name}【${sp.nameCn}】`);
            return;
          }
        }
      }
      addLog(`${pl.name} 结算【${sp.nameCn}】效果 (Step ${effStep}) → ${total}${bonus ? `（含额外成功 +${bonus}）` : ''}`, res.trace, 'hit');
      renderAll();
    }

    function getMonsterEffectiveDef(m, type) {
      let val = Number(m[type]) || 8;
      if (m.knockedDown) val -= 3;
      if (m.blindsided) val -= 2;
      if (m.harried) val -= 2;
      return Math.max(1, val);
    }

    function applyDamageToMonster(instanceId, rawDamage, armorType = 'pa', isKnockdownOnly = false, isStun = false, sourceName = '') {
      const m = state.monsters.find(x => x.instanceId === instanceId);
      if (!m) return;
      const armor = armorType === 'none' ? 0 : (Number(m[armorType]) || 0);
      const net = Math.max(0, rawDamage - armor);

      if (isKnockdownOnly) {
        if (net > 0) {
          const kdStep = Math.max(1, m.kdStep - m.wounds);
          const kdRes = rollStepTest(kdStep, { dn: net, isAction: true });
          if (!kdRes.isSuccess) m.knockedDown = true;
          addLog(
            `${sourceName} 对 ${m.name} 发动击倒攻击（击倒难度 ${net}）→ ${kdRes.isSuccess ? '站稳' : '被击倒倒地'}`,
            kdRes.trace,
            kdRes.isSuccess ? '' : 'warn',
            `${sourceName} 对 ${m.name} 发动击倒攻击 → ${kdRes.isSuccess ? '目标站稳' : '目标被击倒'}`
          );
        } else {
          addLog(`${sourceName} 对 ${m.name} 的击倒攻击被护甲完全抵消`, '');
        }
        renderAll();
        return;
      }

      m.currentDamage += net;
      let woundMsg = '';
      if (!isStun && net >= m.woundThreshold) {
        m.wounds += 1;
        woundMsg = '，造成 1 处负伤';
        if (net >= m.woundThreshold + 5) {
          const kdDn = net - m.woundThreshold;
          const kdRes = rollStepTest(Math.max(1, m.kdStep - m.wounds), { dn: kdDn, isAction: true });
          if (!kdRes.isSuccess) {
            m.knockedDown = true;
            woundMsg += '并击倒目标';
          }
        }
      } else if (isStun && net >= m.woundThreshold) {
        m.harried = true;
        woundMsg = '，目标陷入受扰';
      }

      const statusFlag = m.currentDamage >= m.death ? '【已死亡】' : (m.uncon !== 'NA' && m.currentDamage >= Number(m.uncon) ? '【意识丧失】' : '');
      addLog(
        `${sourceName} 对 ${m.name} 造成 ${net} 点${isStun ? '震慑' : ''}伤害（原始 ${rawDamage} - 护甲 ${armor}）${woundMsg} ${statusFlag}`,
        `当前累计伤害 ${m.currentDamage} / 死亡 ${m.death}`,
        'hit',
        `${sourceName} 重创 ${m.name}${woundMsg} ${statusFlag}`
      );
      renderAll();
    }

    function applyDamageToPl(rawDamage, armorType = 'pa', isKnockdownOnly = false, isStun = false, sourceName = '') {
      const pl = state.pl;
      const d = calcPlDerived();
      const armor = armorType === 'ma' ? d.ma : d.pa;
      const net = Math.max(0, rawDamage - armor);

      if (isKnockdownOnly) {
        if (net > 0) {
          const wb = pl.talents.find(t => t.name.includes('负伤平衡') || t.name.toLowerCase().includes('wound balance'));
          const kdStep = Math.max(1, d.steps.STR + (wb ? wb.rank : 0) + getPlActionMod());
          const kdRes = rollStepTest(kdStep, { dn: net, isAction: true });
          if (!kdRes.isSuccess) pl.statuses.knockedDown = true;
          addLog(`${sourceName} 对 ${pl.name} 发动击倒攻击（难度 ${net}）→ ${kdRes.isSuccess ? '站稳' : '被击倒倒地'}`, kdRes.trace, kdRes.isSuccess ? '' : 'warn');
        }
        renderAll();
        return;
      }

      pl.currentDamage += net;
      let extra = '';
      if (!isStun && net >= d.woundThreshold) {
        pl.wounds += 1;
        extra = '，承受 1 处负伤';
        if (net >= d.woundThreshold + 5) {
          const kdDn = net - d.woundThreshold;
          const wb = pl.talents.find(t => t.name.includes('负伤平衡') || t.name.toLowerCase().includes('wound balance'));
          const kdStep = Math.max(1, d.steps.STR + (wb ? wb.rank : 0) + getPlActionMod());
          const kdRes = rollStepTest(kdStep, { dn: kdDn, isAction: true });
          if (!kdRes.isSuccess) {
            pl.statuses.knockedDown = true;
            extra += '并被击倒';
          }
        }
      } else if (isStun && net >= d.woundThreshold) {
        pl.statuses.harried = true;
        extra = '，陷入受扰状态';
      }

      const stateText = pl.currentDamage >= d.effDeath ? '【角色死亡】' : (pl.currentDamage >= d.effUncon ? '【意识丧失】' : '');
      addLog(`${sourceName} 对 ${pl.name} 造成 ${net} 点伤害（原始 ${rawDamage} - 护甲 ${armor}）${extra} ${stateText}`, `当前伤害 ${pl.currentDamage} / 意识丧失 ${d.effUncon} / 死亡 ${d.effDeath}`, 'fail');
      renderAll();
    }

    function monsterAttackPl(instanceId) {
      const m = state.monsters.find(x => x.instanceId === instanceId);
      if (!m) return;
      const d = calcPlDerived();
      const atkStep = Math.max(1, m.atkStep - m.wounds);
      const res = rollStepTest(atkStep, { dn: d.pd, isAction: true });
      if (!res.isSuccess) {
        addLog(`${m.name} 攻击 ${state.pl.name} → 未命中 (${res.total} vs ${d.pd})`, res.trace);
        return;
      }
      state.pendingReaction = {
        attackerId: m.instanceId,
        attackerType: 'gm',
        attackerName: m.name,
        targetId: 'pl',
        targetType: 'pl',
        targetName: state.pl.name,
        attackName: '近战攻击',
        atkTotal: res.total,
        targetDef: d.pd,
        extraSuccesses: res.extraSuccesses,
        dmgStep: m.dmgStep,
        isMelee: true,
        isKnockdownOpt: false,
        isStunOpt: false,
        armorType: 'pa'
      };
      addLog(`${m.name} 命中 ${state.pl.name} (${res.total} vs ${d.pd}，额外成功 +${res.extraSuccesses})，等待防守方反应`, res.trace, 'warn');
      renderAll();
    }

    function resolveReaction(action) {
      const pr = state.pendingReaction;
      if (!pr) return;
      state.pendingReaction = null;

      if (action === 'avoid' && pr.targetType === 'pl') {
        const pl = state.pl;
        const d = calcPlDerived();
        const t = pl.talents.find(x => x.name.includes('回避打击') || x.name.includes('闪避') || x.name.toLowerCase().includes('avoid blow'));
        const step = Math.max(1, (t ? d.steps[t.attr] + t.rank : d.steps.DEX) + getPlActionMod());
        pl.currentDamage += 1;
        const res = rollStepTest(step, { dn: pr.atkTotal, isAction: true });
        if (res.isSuccess) {
          addLog(`${pl.name} 发动【${t ? t.name : '回避打击'}】（1 劳累值）成功闪避攻击 (${res.total} vs ${pr.atkTotal})`, res.trace, 'hit');
          renderAll();
          return;
        }
        addLog(`${pl.name} 发动【${t ? t.name : '回避打击'}】（1 劳累值）闪避失败 (${res.total} vs ${pr.atkTotal})`, res.trace, 'fail');
      }

      if (action === 'riposte' && pr.targetType === 'pl') {
        const pl = state.pl;
        const d = calcPlDerived();
        const t = pl.talents.find(x => x.name.includes('反击') || x.name.toLowerCase().includes('riposte'));
        const step = Math.max(1, (t ? d.steps[t.attr] + t.rank : d.steps.DEX) + getPlActionMod());
        pl.currentDamage += 2;
        const res = rollStepTest(step, { dn: pr.atkTotal, isAction: true });
        if (res.isSuccess) {
          addLog(`${pl.name} 发动【反击】（2 劳累值）格挡成功 (${res.total} vs ${pr.atkTotal})`, res.trace, 'hit');
          if (res.extraSuccesses >= 1 && pr.attackerType === 'gm') {
            const w = pl.weapons[0] || { name: '武器', dmgStep: 0 };
            const counterDmg = rollStepTest(d.steps.STR + w.dmgStep, { isAction: false }).total + Math.max(0, res.extraSuccesses - 1) * 2;
            applyDamageToMonster(pr.attackerId, counterDmg, 'pa', false, false, `${pl.name} 反击`);
            return;
          }
          renderAll();
          return;
        }
        addLog(`${pl.name} 发动【反击】（2 劳累值）失败 (${res.total} vs ${pr.atkTotal})`, res.trace, 'fail');
      }

      const dmgRes = rollStepTest(pr.dmgStep, { isAction: false });
      const totalDmg = dmgRes.total + pr.extraSuccesses * 2;
      if (pr.targetType === 'gm') {
        applyDamageToMonster(pr.targetId, totalDmg, pr.armorType, pr.isKnockdownOpt, pr.isStunOpt, pr.attackerName);
      } else {
        applyDamageToPl(totalDmg, pr.armorType, pr.isKnockdownOpt, pr.isStunOpt, pr.attackerName);
      }
    }

    function spawnMonster(templateId, count = 1) {
      const tpl = state.monsterTemplates.find(x => x.id === templateId);
      if (!tpl) return;
      for (let i = 0; i < count; i++) {
        const existing = state.monsters.filter(m => m.templateId === templateId).length;
        const suffix = count > 1 || existing > 0 ? ` #${existing + 1}` : '';
        const instanceId = 'inst_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        state.monsters.push({
          ...tpl,
          instanceId,
          templateId: tpl.id,
          name: tpl.name + suffix,
          currentDamage: 0,
          wounds: 0,
          knockedDown: false,
          blindsided: false,
          harried: false
        });
      }
      addLog(`已将 ${count} 名【${tpl.name}】加入战斗`, '');
      renderAll();
    }

    function deleteTemplate(templateId) {
      state.monsterTemplates = state.monsterTemplates.filter(x => x.id !== templateId);
      renderMain();
    }

    function removeMonsterInstance(instanceId) {
      state.monsters = state.monsters.filter(x => x.instanceId !== instanceId);
      state.initiativeList = state.initiativeList.filter(x => x.id !== instanceId);
      renderAll();
    }

      });

    function rollAllInitiative() {
      const d = calcPlDerived();
      const list = [];
      const plStep = Math.max(1, d.initStep + getPlActionMod());
      const plRoll = rollStepTest(plStep, { isAction: false });
      list.push({ id: 'pl', type: 'pl', name: state.pl.name, initVal: plRoll.total, initStep: plStep, dexVal: d.attrs.DEX });

      state.monsters.forEach(m => {
        if (m.currentDamage >= m.death) return;
        let mStep = m.initStep - m.wounds - (m.knockedDown ? 3 : 0) - (m.harried ? 2 : 0);
        mStep = Math.max(1, mStep);
        const mRoll = rollStepTest(mStep, { isAction: false });
        list.push({ id: m.instanceId, type: 'gm', name: m.name, initVal: mRoll.total, initStep: mStep, dexVal: 0 });
      });

      state.initiativeList = list;
      state.turnIndex = 0;
      sortInitiative();
      addLog(`第 ${state.round} 轮全员投先攻完成`, list.map(x => `${x.name}:${x.initVal}`).join(' | '), 'warn');
      renderInitiative();
    }

    function sortInitiative() {
      state.initiativeList.sort((a, b) => {
        if (b.initVal !== a.initVal) return b.initVal - a.initVal;
        if (a.type !== b.type) return a.type === 'pl' ? -1 : 1;
        if (b.dexVal !== a.dexVal) return b.dexVal - a.dexVal;
        return b.initStep - a.initStep;
      });
    }

    function nextTurn() {
      if (state.initiativeList.length === 0) return;
      state.turnIndex = (state.turnIndex + 1) % state.initiativeList.length;
      renderInitiative();
    }

    function nextRound() {
      state.round += 1;
      state.turnIndex = 0;
      state.pl.options = { aggressive: false, defensive: false, knockdown: false, stun: false, splitMove: false, tailAttack: false };
      state.pl.statuses.surprised = false;
      state.pl.statuses.reserved = false;
      addLog(`进入第 ${state.round} 轮（已重置单轮战斗选项）`, '', 'warn');
      renderAll();
    }

    function partyFullRest() {
      const d = calcPlDerived();
      state.pl.recoveryCurrent = d.recoveryMax;
      state.pl.karmaCurrent = d.karmaMax;
      state.pl.options = { aggressive: false, defensive: false, knockdown: false, stun: false, splitMove: false, tailAttack: false };
      state.pl.statuses = { knockedDown: false, blindsided: false, surprised: false, harried: false, reserved: false };
      state.round = 1;
      addLog('全队休整完成：回复检定次数与业力点数已重置，临时战斗状态已清除', '', 'hit');
      renderAll();
    }

    function rollFreeTest() {
      const step = Number(document.getElementById('freeStepInput').value) || 1;
      const dn = document.getElementById('freeDnInput').value;
      const karma = document.getElementById('freeKarmaCheck').checked;
      const res = rollStepTest(step, { karma, dn, isAction: true });
      let suffix = '';
      if (res.isRuleOfOne) suffix = ' [全一规则大失败]';
      else if (res.isSuccess === true) suffix = ` [成功，额外成功 +${res.extraSuccesses}]`;
      else if (res.isSuccess === false) suffix = ' [失败]';
      addLog(`自由检定 (Step ${step}) → ${res.total}${suffix}`, res.trace, res.isSuccess === true ? 'hit' : (res.isSuccess === false ? 'fail' : ''));
    }
